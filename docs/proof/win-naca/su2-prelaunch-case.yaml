name: win-su2-tmr-naca0012
description: Native SU2 v8.5.0 serial code-to-code comparison with CFL3D SA-noft2
  first-order turbulence, exact NASA Family II L6, fully turbulent.
purpose:
  spike: SPIKE-04
  stage: 1
  round: 3
  run_id: R3-G0
  question: Does removing the limited laplacian/snGrad correction (the only scheme
    term that acts on L6 alone) move L6's Cl toward the L5/L4 level (H1)?
geometry:
  airfoil: naca0012 (TMR sharp-trailing-edge definition, 2DN00)
  chord: 1.0
  source:
    kind: tmr-grid
    path: docs/proof/win-naca/su2-inputs/tmr-familyII-L6.su2
    sha256: a4709ce352e5aff94395e28f62b1c91fdad957d2330fd8166cf23b0d655ba827
    generator: docs/proof/win-naca/freeze-su2.py from pinned NASA Family II PLOT3D;
      shared fixtures unchanged
    reference: https://tmbwg.github.io/turbmodels/naca0012numerics_grids.html (grid
      page; zip https://www.nasa.gov/wp-content/uploads/2026/02/naca0012numerics-grids.zip,
      member u/piyer/nasa_tmr/gitlab/turbmodels/NACA0012numerics_grids/n0012familyII.6.p2dfmt.gz)
    deviation: SU2 node-centred finite volume vs CFL3D cell-centred; different spatial
      implementation and SA S-hat handling; no GCI or physical-validation claim
conditions:
  reynolds: 6000000
  mach: 0.15
  alpha: 10.0
  speed_m_s: 1.0
  reference_length_m: 1.0
solver: su2
backend:
  name: SU2 native Windows win64-omp
  version: 8.5.0 Harrier
  build: v8.5.0 publisher release
  distribution: SU2-v8.5.0-win64-omp.zip
  distribution_sha256: 4466fe21aedb5e0bad57afd45f829acbdec6ec79fe8c3f8954ddea06a4b4bc11
  binary_sha256:
    SU2_CFD.exe: 3cb60646b31c08e468441be9f3497601960d4bb31349e6329982bcdeed599248
  activation: native SU2_CFD.exe -t 1 tmr-sa.cfg; BELOW_NORMAL_PRIORITY_CLASS
  docker_used: false
  image_digest: null
mesh:
  generator: plot3d-direct
  target_y_plus: null
  first_cell_height_m: null
  settings:
    family: II
    level: 6
    dims:
    - 225
    - 65
    span_m: 1.0
    wake_cut: merged into internal faces by the converter
  gate:
    max_non_orthogonality_deg: 70
    max_skewness: 4
    min_cell_determinant: 0.001
physics:
  application: SU2_CFD
  flow: incompressible-steady
  turbulence_model: SpalartAllmaras
  wall_treatment: wall-resolved (nuTilda = 0 and nut = 0 at the wall)
  transition: none; fully turbulent
  fluid:
    name: non-dimensional
    nu_m2_s: 1.6666666666666668e-07
  freestream:
    U_m_s: 1.0
    nuTilda_over_nu: 3.0
  sa_variant: SA_OPTIONS=NONE (no WITHFT2), freestream nuTilda/nu=3
boundary_conditions:
  farfield: freestreamVelocity (cos 10, sin 10, 0) / freestreamPressure 0; nuTilda
    inletOutlet 3 nu; about 500 c
  airfoil: noSlip; nuTilda 0; nut 0; p zeroGradient
  frontAndBack: empty
numerics:
  config: docs/proof/win-naca/su2-inputs/tmr-sa.cfg
  config_sha256: 0f450bd096c8809871c5bc7ff8b9529acd47bcb8f0ebb62060aeede9cb1d1dee
  max_iterations: 20000
  convergence: Report residual drop and final 2000-row Cl/Cd half-bands; caps Cl1e-5/Cd1e-6,
    minimum 3-order RMS residual drop; final result inadmissible if these fail; no
    tuning after failure
decomposition:
  method: serial
  n_subdomains: 1
  nice: Windows BELOW_NORMAL_PRIORITY_CLASS
  omp_threads: 1
outputs_expected:
- history.csv
- log.SU2_CFD
- su2-resources.json
run_dir: runs/20261008T144728Z-win-su2-tmr-naca0012
