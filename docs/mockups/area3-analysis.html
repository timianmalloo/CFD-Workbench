<title>Area 3 analysis</title>
<!--
  Area 3 (Analysis, local tiers) review mockup for the operator's approval before any build
  (docs/design/area3-analysis.md §12; Ruling 60 lane F2). Nine screens of the whole 1280 x 800 shell, in today's shell
  (m12b2 views, structure-B Properties, V2 status strip DR-STATUS-1, DR-VIEW-1 gutters) plus the Analysis additions:
  the CAD | Analysis toggle, the conditions band, the layers, the Layers pane and the bottom panel.
  Every number on the analysis screens is COMPUTED in this page from the Example foil (example.foil: 900 mm span,
  120 mm chord, twist 0 → −2° at the tip, symmetric section-a, no dihedral) by a reference horseshoe vortex lattice
  (64 spanwise per half, cosine; 4 chordwise, cosine; planar wake) at 10 kn, seawater 15 °C (ρ 1026.02 kg/m³,
  ν 1.1892e-6 m²/s, p_v 1.6709 kPa, data-and-constants.md:146), h_ref 0.5 m, α 3°. That lattice is this page's, not the
  product method; the run keys are placeholders (not BLAKE3). Display only; nothing is built from this page.
-->
<style>

<body>
<header class="top">
  <h1>Area 3 — Analysis (local tiers), in today's shell</h1>
  <p>Example foil · 900 mm span · 120 mm chord · −2° tip twist · 10 kn · seawater 15 °C · h_ref 0.5 m · α 3° · loads computed in this page by a reference lattice · run keys illustrative</p>
  <div class="harness"><button type="button" id="theme" aria-pressed="false">Dark theme</button><button type="button" id="size" aria-pressed="false">1024 × 700</button></div>
  <div class="audit" id="audit" role="status">Checking…</div>
</header>
<main id="screens"></main>
<script>
'use strict';
// ------------------------------------------------------------ inputs (example.foil + data-and-constants.md:146)
const HALF = 0.45, CHORD = 0.12, TC = 0.12, KN = 0.514444, V = 10 * KN, ALPHA = 3, RHO = 1026.02, NU = 1.1892e-6, PV = 1670.9, PATM = 101325, G = 9.80665, HREF = 0.5;
const TWIST_CV = [[0, 0], [0.1, 0], [0.3, -0.25], [0.5, -0.5], [0.7, -1], [0.9, -1.5], [1, -2]];
const K3 = [0, 0, 0, 0, 0.25, 0.5, 0.75, 1, 1, 1, 1];
function deBoor(p, U, P, u){
  const n = P.length - 1; u = Math.min(Math.max(u, U[p]), U[n + 1] - 1e-12);
  let k = p; while (k < n && u >= U[k + 1]) k++;
  const d = []; for (let j = 0; j <= p; j++) d.push(P[k - p + j].slice());
  for (let r = 1; r <= p; r++) for (let j = p; j >= r; j--){ const i = k - p + j, den = U[i + p - r + 1] - U[i], a = den ? (u - U[i]) / den : 0;
    d[j] = [(1 - a) * d[j - 1][0] + a * d[j][0], (1 - a) * d[j - 1][1] + a * d[j][1]]; }
  return d[p];
}
const TW = []; for (let i = 0; i <= 1000; i++) TW.push(deBoor(3, K3, TWIST_CV, i / 1000));
function twistAt(eta){ for (let i = 1; i < TW.length; i++) if (TW[i][0] >= eta){ const a = TW[i - 1], b = TW[i], w = b[0] === a[0] ? 0 : (eta - a[0]) / (b[0] - a[0]); return a[1] + w * (b[1] - a[1]); } return TW[TW.length - 1][1]; }

// ------------------------------------------------------------ reference horseshoe lattice (Katz & Plotkin), planar
const NS = 64, NC = 4, RAD = Math.PI / 180;
function solveVLM(alpha){
  const t0 = performance.now();
  const yEdge = []; for (let i = 0; i <= 2 * NS; i++) yEdge.push(-HALF * Math.cos(Math.PI * i / (2 * NS)));   // cosine over full span
  const xEdge = []; for (let k = 0; k <= NC; k++) xEdge.push(CHORD * (1 - Math.cos(Math.PI * k / NC)) / 2);
  const P = [];
  for (let s = 0; s < 2 * NS; s++) for (let c = 0; c < NC; c++){
    const ya = yEdge[s], yb = yEdge[s + 1], dx = xEdge[c + 1] - xEdge[c], ym = (ya + yb) / 2;
    P.push({ s, c, ya, yb, ym, xb: xEdge[c] + dx / 4, xc: xEdge[c] + 3 * dx / 4, th: twistAt(Math.abs(ym) / HALF) });
  }
  const far = 20 * 2 * HALF;
  function seg(px, py, ax, ay, bx, by){            // z-velocity at (px,py,0) by a unit segment in the z = 0 plane
    const r1x = px - ax, r1y = py - ay, r2x = px - bx, r2y = py - by, cz = r1x * r2y - r1y * r2x, c2 = cz * cz;
    if (c2 < 1e-20) return 0;
    const r1 = Math.hypot(r1x, r1y), r2 = Math.hypot(r2x, r2y), r0x = bx - ax, r0y = by - ay;
    const dot = r0x * (r1x / r1 - r2x / r2) + r0y * (r1y / r1 - r2y / r2);
    return cz / c2 * dot / (4 * Math.PI);
  }
  function hs(px, py, q){ return seg(px, py, far, q.ya, q.xb, q.ya) + seg(px, py, q.xb, q.ya, q.xb, q.yb) + seg(px, py, q.xb, q.yb, far, q.yb); }
  const n = P.length, A = P.map(pi => P.map(pj => hs(pi.xc, pi.ym, pj))), b = P.map(pi => -V * Math.sin((alpha + pi.th) * RAD));
  for (let i = 0; i < n; i++){                      // Gaussian elimination, partial pivoting
    let m = i; for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r;
    [A[i], A[m]] = [A[m], A[i]]; [b[i], b[m]] = [b[m], b[i]];
    for (let r = i + 1; r < n; r++){ const f = A[r][i] / A[i][i]; if (!f) continue; for (let c = i; c < n; c++) A[r][c] -= f * A[i][c]; b[r] -= f * b[i]; }
  }
  const gam = new Array(n); for (let i = n - 1; i >= 0; i--){ let s = b[i]; for (let c = i + 1; c < n; c++) s -= A[i][c] * gam[c]; gam[i] = s / A[i][i]; }
  const strips = [];
  for (let s = 0; s < 2 * NS; s++){
    const ya = yEdge[s], yb = yEdge[s + 1], dy = yb - ya, Gs = P.filter(p => p.s === s).reduce((a, p) => a + gam[P.indexOf(p)], 0);
    strips.push({ s, ya, yb, y: (ya + yb) / 2, dy, G: Gs, L: RHO * V * Gs * dy, th: twistAt(Math.abs((ya + yb) / 2) / HALF) });
  }
  for (const t of strips){                          // Trefftz plane: downwash from the trailing vortex sheet
    // infinite 2D trailing vortices: 1/(2π), twice the lifting-line downwash (07 §Vortex lattice); α_i uses w_T/2
    let w = 0; for (const q of strips) w += q.G / (2 * Math.PI) * (1 / (t.y - q.ya) - 1 / (t.y - q.yb)) * -1;
    t.wT = w; t.Di = -0.5 * RHO * t.G * w * t.dy; t.cl = 2 * t.G / (V * CHORD); t.aEff = alpha + t.th + Math.atan2(w / 2, V) / RAD;
  }
  const q = 0.5 * RHO * V * V, S = 2 * HALF * CHORD, b2 = (2 * HALF) ** 2, AR = b2 / S;
  const L = strips.reduce((a, t) => a + t.L, 0), Di = strips.reduce((a, t) => a + t.Di, 0);
  const CL = L / (q * S), CDi = Di / (q * S), e = CL * CL / (Math.PI * AR * CDi);
  const star = strips.filter(t => t.y > 0), Lh = star.reduce((a, t) => a + t.L, 0);
  const yCl = star.reduce((a, t) => a + t.L * t.y, 0) / Lh, Mroot = star.reduce((a, t) => a + t.L * t.y, 0);
  return { alpha, strips, L, Di, CL, CDi, e, q, S, AR, yCl, Mroot, Lh, panels: n, ms: performance.now() - t0 };
}
const R = solveVLM(ALPHA), R12 = solveVLM(12), R2 = solveVLM(2), RUNS = { R, R12, R2 };
const runOf = sc => RUNS[sc.run || 'R'];
let RUN = R;
const sigma = (PATM + RHO * G * HREF - PV) / R.q, FrH = V / Math.sqrt(G * HREF), hc = HREF / CHORD, ReRef = V * CHORD / NU;
const f = (v, d) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const fe = v => { const p = Math.floor(Math.log10(Math.abs(v))), m = v / 10 ** p; return `${m.toFixed(2)} × 10${String(p).split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c] || '⁻').join('')}`; };

// ------------------------------------------------------------ copy (DESIGN.md §7 rows quoted; new rows marked NEW)
const COPY = {
  c45:'Unavailable — depth not set',
  c46:`Deep-water result; free surface not modelled (h/c = ${f(hc, 2)}, Fr_h = ${f(FrH, 2)}; effects measured below h/c 5)`,
  c47:'Static geometry; steady analysis cannot predict ventilation onset; onset is dynamic and hysteretic',
  c42:'Structural: Not assessed', c43:'geometry only (Structural: Not assessed)',
  c60:'Loads are hydrodynamic estimates. Not a structural assessment. Strength, stiffness and fatigue are not evaluated.',
  c63:'Computed estimate · Model uncertainty not quantified', c64:'Historical — <what changed>', c72:'Section-based inference',
  vlmLabelOf: depthSet => `attached flow; no stall; no ventilation; ${depthSet ? 'deep water' : 'free surface not modelled'}`,   // DR-ANA-13 (spec amendment)
  notModelled: depthSet => `Not modelled: ${depthSet ? '' : 'free surface, '}ventilation, junctions, unsteady, tip-vortex cavitation, surface state; separation only as “Section-based inference”.`,
  none:'No analysis yet. Set the conditions, then Evaluate.',                                          // NEW
  running:`Evaluating — VLM + strip · ${R.panels} panels…`,                                            // NEW
  failed:'Analysis failed — the lattice system is singular at the tip strip (ANA-SOLVE-RESIDUAL). The previous result is kept as Historical.', // NEW
  done:`Analysis complete — VLM + strip · ${(R.ms / 1000).toFixed(2)} s`,                             // NEW
  inert:'Points are edited in CAD. Switch with the CAD | Analysis toggle.',                           // NEW
  noPolar:'Unavailable — no polar method installed',                                                   // NEW
  preview:'Preview hidden — Apply or Cancel in CAD' };
const A_L0 = 0, SWEEP = 0, BOUND = '|α_eff − α_L0| ≤ 10°, Cl_local ≤ 1.0, quarter-chord sweep ≤ 30°';   // section-a is symmetric (α_L0 = 0); the Example foil is unswept
const partsOf = s => [Math.abs(s.aEff - A_L0) > 10 ? '|α_eff − α_L0|' : '', Math.abs(s.cl) > 1.0 ? 'Cl_local' : '', SWEEP > 30 ? 'sweep' : ''].filter(Boolean);
const outsideOf = run => run.strips.filter(s => partsOf(s).length).length;
const envRowOf = run => { const n = outsideOf(run), m = run.strips.length; if (!n) return `Inside the method envelope (${BOUND}) at all ${m} strips`;
  const ex = [...new Set(run.strips.flatMap(partsOf))].join(', '); return `Outside the method envelope (${BOUND}) — ${n} of ${m} strips; exceeded: ${ex}`; };
const stripEnvOf = s => { const parts = partsOf(s), vals = `|α_eff − α_L0| ${f(Math.abs(s.aEff - A_L0), 2)}° ≤ 10° · Cl_local ${f(s.cl, 3)} ≤ 1.0 · sweep ${f(SWEEP, 0)}° ≤ 30°`;
  return parts.length ? `Outside the method envelope at this strip — exceeded: ${parts.join(', ')} (${vals})` : `Inside the method envelope at this strip (${vals})`; };
const eNoteOf = run => run.e > 1 ? `e above 1 on a planar wing is a lattice effect at ${NS} × ${NC} (it converges from above); see DR-ANA-7` : '';
const SEL = R.strips.reduce((a, s) => Math.abs(s.y - 0.3) < Math.abs(a.y - 0.3) ? s : a), ETA_SEL = SEL.y / HALF;
const hist = COPY.c64.replace('<what changed>', 'geometry changed (r4 → r5)');

// ------------------------------------------------------------ drawing

    <div class="sb" role="status"><span class="msg${sc.state === 'failed' ? ' error' : ''}">${sc.report}</span><span class="item ${status[0]}">${status[1]}</span><span class="item">${sc.station ? `Station η ${f(ETA_SEL, 3)}` : 'Basic foil'}</span><span class="item">N · m</span></div></div>`;
}
const SCREENS = [
  { id:'none', h:'1 · Analysis entered — no result yet, depth not set', state:'none', depth:false, report:'Analysis. Set the conditions, then Evaluate.',
    what:'<b>Shows</b> the toggle pressed on <i>Analysis</i> (camera, layout and selection unchanged from CAD), the conditions band with depth empty: σ reads COPY-45 and no deep-water label prints (ANA-19). No layers, no numbers that were not computed. Properties and the bottom panel say what to do. <b>Implements</b> design §12.1–12.3 "No result" and "Depth unset"; ANA-22; ANA-19 row 1.' },
  { id:'running', h:'2 · Evaluating, a prior run kept as Historical', state:'running', prior:true, layers:true, run:'R2', report:COPY.running,
    what:'<b>Shows</b> Evaluate turned into Cancel; skeleton rows (static, no shimmer, DESIGN.md §6); the status item "Running"; the previous run\'s layers stay, under the Historical banner, until the new run lands. <b>Implements</b> §12.3 "Running"; §8 latest-wins cancellation.' },
  { id:'current', h:'3 · Wing result, Current — loading on the geometry, labels and omissions', state:'current', layers:true, report:COPY.done,
    what:`<b>Shows</b> the computed wing result (CL ${f(RUN.CL, 3)}, CDi ${f(RUN.CDi, 5)}, e ${f(RUN.e, 3)}, L ${f(RUN.L, 1)} N) under the tier chip with the envelope verdict beside CL and b, the moment datum and the force axes beside S_ref, COPY-63, the fixed VLM label, the A5.1 deep-water string (h/c ${f(hc, 2)} &lt; 5), the ventilation string and the omissions. Total drag Unavailable naming its missing parts (A5.6). Plan: loading strips (batlow, legend with variable, unit, range, map, run); 3D: lift per strip, the total and the root moment arc, the free surface and tip depth. Bottom: spanwise loading vs the elliptic reference with a table twin. <b>Implements</b> ANA-03, ANA-04, ANA-19, ANA-21, ANA-23; C2 colormap rule.` },
  { id:'nodepth', h:'3b · Wing result with depth unset — the label reads “free surface not modelled”', state:'current', layers:true, depth:false, report:COPY.done,
    what:'<b>Shows</b> the same result with Depth h_ref empty: the fixed VLM label reads “attached flow; no stall; no ventilation; free surface not modelled” — never “deep water” (DR-ANA-13, a spec amendment request); h/c, Fr_h, σ and V_crit read COPY-45; no tip-depth line, no free-surface line in 3D. <b>Implements</b> ANA-19 row 1; §5.4 depth basis; DR-ANA-13.' },
  { id:'station', h:'4 · A station selected — strip result with its own verdict and omissions, section Unavailable, Loads tab', state:'current', layers:true, station:true, tab:'Loads', report:COPY.inert,
    what:'<b>Shows</b> selecting a station in Analysis: Properties switches to that strip (per span, N/m, lowercase Cl) with its own envelope verdict (each bound with this strip’s value), Re_local against the polar’s Re range (Unavailable — there is no polar yet, so never “inside”) and the “Not modelled” list; the section tier reads Unavailable with its reason (DR-ANA-1, DR-ANA-2) — never a nearby value; a press on a point gives the inert-point message. Loads: COPY-60 verbatim, centre of lift, root bending moment, computed wing loading, Structural: Not assessed with its list and the relative-stiffness readout. <b>Implements</b> ANA-01 (Unavailable), ANA-03, ANA-11, §12.1 "Editing in Analysis".' },
  { id:'historical', h:'5 · Historical after a CAD edit, with a draft hidden — Provenance tab', state:'historical', layers:true, preview:true, tab:'Provenance', report:'Analysis. Run k-7c1e… is Historical: geometry changed.',
    what:'<b>Shows</b> returning to Analysis after a twist point moved and while a point draft is open: the preview is hidden (ANA-22), the layers stay on the accepted revision with COPY-64 on the area and the chip; Provenance shows the Run manifest and which input changed. Nothing recomputes until Evaluate (DR-ANA-6). <b>Implements</b> ANA-07, ANA-22, §3.4 "what changed".' },
  { id:'envelope', h:'7 · Outside the method envelope (α 12°)', state:'current', layers:true, run:'R12', report:'Analysis complete — VLM + strip. Some strips are outside the method envelope.',
    what:'<b>Shows</b> a result at α 12°: the finding on the row directly after CL, with the full bound (|α_eff − α_L0|, Cl_local, quarter-chord sweep) and which parts were exceeded, and every strip outside |α_eff| ≤ 10° outlined dashed on the Plan with a text count — not colour alone. The number is shown with its envelope, never bare. <b>Implements</b> §5.4 envelope verdict; FM-21; DR-ANA-14.' },
  { id:'tampered', h:'8 · A stored run failed its check', state:'tampered', report:'Run k-7c1e… failed its check and is not shown.',
    what:'<b>Shows</b> a run whose stored payload no longer matches its content hash: that run reads Unavailable, no layers draw, nothing is deleted. <b>Implements</b> §3.6 integrity; FM-19.' },

    what:'<b>Shows</b> a failed evaluation: the error card in Properties (code and reason), the error report in the V2 strip, the status item "Failed", and the previous run still drawn with its Historical banner — never cleared, never shown as Current. <b>Implements</b> §12.3 "Failed"; F4 node O; FM-3.' } ];
document.addEventListener('click', e => { const b = e.target.closest('.twin'); if (!b) return; const id = b.closest('section.screen').dataset.id, sc = SCREENS.find(s => s.id === id); sc.twin = !sc.twin; render(); const again = document.querySelector(`section.screen[data-id="${id}"] .twin`); if (again) again.focus(); });
function render(){
  document.getElementById('screens').innerHTML = SCREENS.map(sc => `<section class="screen" data-id="${sc.id}" aria-labelledby="h-${sc.id}"><h2 id="h-${sc.id}">${sc.h}</h2><p class="what">${sc.what}</p>${shell(sc)}</section>`).join('') +
    `<section class="choices"><h2>Choices for the operator</h2><ul>
      <li><b>Evaluate is explicit</b> (DR-ANA-6): Historical stays visible until you press it. The alternative recomputes on every change and the Historical state flashes past.</li>
      <li><b>Where the toggle lives</b>: the CAD | Analysis segment at the left of the view bar here; also View ▸ Analysis and a shortcut (DR-ANA-8 recommends ⌘2 / ⌘3); the activity rail is DR-7.</li>
      <li><b>Section numbers</b> read Unavailable until a polar method (DR-ANA-1) and a Cp method (DR-ANA-2) are chosen. Nothing on this page fills them.</li>
      <li><b>Not on this page</b>: Compare (ANA-06), Find operating α (ANA-05), the free-surface correction layer (A5.2), goal-state operating points (Area 1 is not built), the assistant entry.</li></ul></section>`;
  paint(); audit();
}
function paint(){
  document.querySelectorAll('section.screen').forEach(secEl => {
    const sc = SCREENS.find(s => s.id === secEl.dataset.id);
    RUN = runOf(sc);
    secEl.querySelectorAll('.view').forEach(view => {
      const cv = view.querySelector('canvas'), w = view.clientWidth, h = view.clientHeight, dpr = devicePixelRatio || 1;
      cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = C.vp; g.fillRect(0, 0, w, h);
      const lay = { layers: !!sc.layers, depth: sc.depth, station: !!sc.station, dimPoints: sc.mode !== 'cad' };
      view.dataset.v === 'plan' ? drawPlan(g, w, h, lay) : draw3D(g, w, h, lay);
    });
    secEl.querySelectorAll('canvas.loading').forEach(drawLoading);
  });
}
// ------------------------------------------------------------ in-artifact checks (review chrome; never ships)
function lum(c){ const m = c.match(/\d+(\.\d+)?/g).map(Number).slice(0, 3).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2]; }
function ratio(a, b){ const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function bg(el){ while (el){ const c = getComputedStyle(el).backgroundColor; if (c && !/rgba\(0, 0, 0, 0\)|transparent/.test(c)) return c; el = el.parentElement; } return 'rgb(255,255,255)'; }
function audit(){
  const out = [], frame = document.querySelector('.shell').getBoundingClientRect();
  if (!frame.width || !frame.height){ document.getElementById('audit').innerHTML = '<b class="fail">page not rendered</b>'; return; }
  let worst = 99, worstWhat = '';
  document.querySelectorAll('.shell *').forEach(el => { if (!el.childNodes.length || ![...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) return;
    const rr = ratio(getComputedStyle(el).color, bg(el)); if (rr < worst){ worst = rr; worstWhat = el.textContent.trim().slice(0, 32); } });
  out.push(worst >= 4.5 ? `<b class="pass">text contrast ≥ 4.5:1</b> (lowest ${worst.toFixed(2)})` : `<b class="fail">text contrast ${worst.toFixed(2)}:1</b> at “${worstWhat}”`);
  const small = [...document.querySelectorAll('.shell button, .shell input, .shell select')].filter(el => el.offsetParent !== null).filter(el => { const b = el.getBoundingClientRect(); return b.height < 23.5 || b.width < 23.5; });
  out.push(small.length ? `<b class="fail">${small.length} targets under 24 px</b>` : '<b class="pass">targets ≥ 24 px</b>');
  const txt = document.getElementById('screens').innerText, bad = ['NaN', 'undefined', 'Infinity', '<reason>', '<what changed>'].filter(s => txt.includes(s));
  out.push(bad.length ? `<b class="fail">placeholder or non-number: ${bad.join(', ')}</b>` : '<b class="pass">no NaN / placeholder</b>');
  const minFont = Math.min(...[...document.querySelectorAll('.shell *')].filter(el => el.innerText && el.innerText.trim()).map(el => parseFloat(getComputedStyle(el).fontSize)));
  out.push(minFont >= 11 ? `<b class="pass">text ≥ 11 px</b>` : `<b class="fail">text ${minFont}px</b>`);
  const recon = Math.abs(R.strips.reduce((a, t) => a + t.L, 0) - R.L) / R.L, sym = Math.abs(R.strips.reduce((a, t) => a + t.L * t.y, 0)) / R.L;
  out.push(recon < 1e-12 && sym < 1e-9 && R.e > 0.9 && R.e <= 1.005 ? `<b class="pass">lattice sane</b> (e ${R.e.toFixed(3)}, Σ strips = L, rolling moment ${sym.toExponential(1)} m)` : `<b class="fail">lattice check</b> e ${R.e}`);
  document.getElementById('audit').innerHTML = out.join(' · ');
}
document.getElementById('theme').addEventListener('click', e => { const d = document.documentElement.dataset.theme === 'light'; document.documentElement.dataset.theme = d ? 'dark' : 'light'; e.currentTarget.setAttribute('aria-pressed', String(d)); e.currentTarget.textContent = d ? 'Light theme' : 'Dark theme'; paint(); audit(); });
document.getElementById('size').addEventListener('click', e => { const s = document.body.classList.toggle('small'); e.currentTarget.setAttribute('aria-pressed', String(s)); e.currentTarget.textContent = s ? '1280 × 800' : '1024 × 700'; paint(); audit(); });
render();
</script>
