<title>Planform point verbs</title>
<!--
  Stop-and-show page for Ruling 62 (operator, 2026-10-03): Add point, Remove point and Rebuild to N on the planform
  outline, designed in docs/design/planform-point-verbs.md. Six screens of today's 1280 x 800 shell on the New foil.
  Geometry is COMPUTED here: the New foil rails are rebuilt the way FoilSource.NewDefault builds them (10 vertices,
  tip-clustered knots, power 3; least squares to the unit chord sqrt(1 - 0.99 eta^2) with the end pins; scaled to
  0.1 m^2). Rebuild, Add and Remove run the design's algorithms (section 6.4) on those curves, and every number printed
  is measured on the A4.5 distribution-curve oracle (201 uniform eta plus every knot of both curves). Display only.
-->
<style>
:root{ --font: system-ui, -apple-system, "Segoe UI", sans-serif; }
:root[data-theme="light"]{ --canvas:#f0f2f1; --surface:#fbfcfb; --soft:#e8edeb; --ink:#1b2929; --mute:#526362; --line:#c9d3cf; --control:#788d87; --accent:#006c67; --warn:#895900; --danger:#a92e37; }
:root[data-theme="dark"]{ --canvas:#172326; --surface:#1e2d31; --soft:#2a3d40; --ink:#ebf3f0; --mute:#b2c4bf; --line:#49605b; --control:#79928c; --accent:#88d8c6; --warn:#efc576; --danger:#ffaeb5; }
*{ box-sizing:border-box; }
html, body{ margin:0; background:var(--canvas); color:var(--ink); font:13px/1.45 var(--font); }

.top label{ margin-left:auto; font-size:12px; color:var(--mute); }
.top select, .top button{ min-height:28px; padding:0 10px; border:1px solid var(--control); border-radius:4px; background:var(--surface); color:var(--ink); }
main{ padding:16px 20px 40px; }
section.screen{ margin:0 0 28px; }

.title{ flex:0 0 28px; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--surface); border-bottom:1px solid var(--line); color:var(--mute); font-size:12px; }
.title i{ width:11px; height:11px; border-radius:50%; background:var(--line); display:inline-block; }

.views{ position:absolute; inset:0; display:grid; gap:4px; grid-template-columns:1fr; }

<body>
<header class="top">
  <h1>Planform outline — Add point, Remove point, Rebuild to N</h1>
  <p>New foil · 1000 mm span · 0.1 m² · rails rebuilt in the page the way New foil builds them · every number measured, not typed</p>
  <label for="state">State <select id="state"></select></label>
  <button type="button" id="theme" aria-pressed="false">Dark theme</button>
</header>
<main id="screens"></main>
<script>
'use strict';
const MEASURE = {};
// ================================================================ B-spline engine (degree 3, clamped; Piegl–Tiller)
const P = 3;
function findSpan(U, n, t){ if (t >= U[n]) { let k = n - 1; while (k > P && U[k] === U[k + 1]) k--; return k; } let k = P; while (k < n - 1 && t >= U[k + 1]) k++; return k; }
function basisRow(U, n, t){                                   // A2.2: the p + 1 non-zero basis values, spread into a row
  const k = findSpan(U, n, t), N = [1], L = [], R = [];
  for (let j = 1; j <= P; j++){ L[j] = t - U[k + 1 - j]; R[j] = U[k + j] - t; let saved = 0;
    for (let r = 0; r < j; r++){ const den = R[r + 1] + L[j - r], tmp = den ? N[r] / den : 0; N[r] = saved + R[r + 1] * tmp; saved = L[j - r] * tmp; } N[j] = saved; }
  const row = new Array(n).fill(0); for (let j = 0; j <= P; j++) row[k - P + j] = N[j]; return row;
}
const curve = (U, X, Y, ids) => ({ U, X, Y, ids });
function evalAt(c, t){ const row = basisRow(c.U, c.X.length, t); let x = 0, y = 0; for (let i = 0; i < row.length; i++){ x += row[i] * c.X[i]; y += row[i] * c.Y[i]; } return [x, y]; }
function paramAt(c, eta){ let lo = 0, hi = 1; for (let s = 0; s < 64; s++){ const m = (lo + hi) / 2; if (evalAt(c, m)[0] < eta) lo = m; else hi = m; } return (lo + hi) / 2; }
const valueAt = (c, eta) => evalAt(c, paramAt(c, eta))[1];
const greville = (U, n) => Array.from({ length:n }, (_, i) => (U[i + 1] + U[i + 2] + U[i + 3]) / 3);
function uniformKnots(n){ const U = [0, 0, 0, 0]; for (let i = 1; i <= n - 4; i++) U.push(i / (n - 3)); U.push(1, 1, 1, 1); return U; }
function tipClustered(n, power){ const U = [0, 0, 0, 0]; for (let i = 1; i <= n - 4; i++) U.push(1 - Math.pow(1 - i / (n - 3), power)); U.push(1, 1, 1, 1); return U; }
// equality-constrained least squares: minimise |A y − b|² subject to y[i] = v for each pin (KKT, Gaussian elimination)
function lsq(A, b, n, pins){
  const m = n + pins.length, M = Array.from({ length:m }, () => new Array(m + 1).fill(0));
  for (let i = 0; i < n; i++){
    for (let j = 0; j < n; j++){ let s = 0; for (let r = 0; r < A.length; r++) s += A[r][i] * A[r][j]; M[i][j] = s; }
    let s = 0; for (let r = 0; r < A.length; r++) s += A[r][i] * b[r]; M[i][m] = s; }
  pins.forEach(([i, v], q) => { M[n + q][i] = 1; M[i][n + q] = 1; M[n + q][m] = v; });
  for (let col = 0; col < m; col++){ let piv = col; for (let r = col + 1; r < m; r++) if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
    [M[col], M[piv]] = [M[piv], M[col]]; const d = M[col][col]; if (Math.abs(d) < 1e-300) throw new Error('singular');
    for (let r = 0; r < m; r++){ if (r === col) continue; const f = M[r][col] / d; if (!f) continue; for (let c = col; c <= m; c++) M[r][c] -= f * M[col][c]; } }
  const y = new Array(n); for (let i = 0; i < n; i++) y[i] = M[i][m] / M[i][i];
  pins.forEach(([i, v]) => { y[i] = v; });                    // pins exact (as FitOrdinates writes them)
  return y;
}
// ================================================================ the New foil rails (FoilSource.NewDefault, rails only)
const HALF_M = 0.5, UNIT_CHORD = eta => Math.sqrt(Math.max(0, 1 - 0.99 * eta * eta));
const NEW_U = tipClustered(10, 3), NEW_X = greville(NEW_U, 10);
function fitOrdinates(U, X, etas, targets, pins){ const n = X.length, c0 = curve(U, X, new Array(n).fill(0));
  const A = etas.map(e => basisRow(U, n, paramAt(c0, e))); return lsq(A, targets, n, pins); }
const ETA401 = Array.from({ length:401 }, (_, i) => i / 400);
const lead0 = fitOrdinates(NEW_U, NEW_X, ETA401, ETA401.map(e => (1 - UNIT_CHORD(e)) / 4), [[0, 0], [1, 0], [9, (1 - UNIT_CHORD(1)) / 4]]);
const trail0 = fitOrdinates(NEW_U, NEW_X, ETA401, ETA401.map(e => (1 - UNIT_CHORD(e)) / 4 + UNIT_CHORD(e)), [[0, 1], [1, 1], [9, (1 - UNIT_CHORD(1)) / 4 + UNIT_CHORD(1)]]);
// scale so the area is 0.1 m² (area = 2 · half span · ∫ chord dη; Simpson on 2001 samples of the evaluated rails)
const ids10 = Array.from({ length:10 }, (_, i) => `cv-${i}`);
function chordIntegral(l, t){ const n = 2000; let s = 0; for (let i = 0; i <= n; i++){ const e = i / n, w = i === 0 || i === n ? 1 : i % 2 ? 4 : 2; s += w * (valueAt(t, e) - valueAt(l, e)); } return s / (3 * n); }
const unitArea = 2 * HALF_M * chordIntegral(curve(NEW_U, NEW_X, lead0), curve(NEW_U, NEW_X, trail0));
const SCALE_MM = 0.1 / unitArea * 1000;                       // root chord in mm
const LEAD = curve(NEW_U, NEW_X, lead0.map(v => v * SCALE_MM), ids10);
const TRAIL = curve(NEW_U, NEW_X, trail0.map(v => v * SCALE_MM), ids10.slice());
MEASURE.newFoil = { rootChordMm: +SCALE_MM.toFixed(3), tipChordMm: +(SCALE_MM * UNIT_CHORD(1)).toFixed(3), points: 10, rootSquare: TRAIL.Y[1] === TRAIL.Y[0] && LEAD.Y[1] === LEAD.Y[0] };
// ================================================================ the A4.5 distribution-curve oracle
function oracle(a, b){                                        // 201 uniform η plus every interior knot of both curves (at its η)
  const etas = Array.from({ length:201 }, (_, i) => i / 200);
  for (const c of [a, b]) for (let i = P + 1; i < c.U.length - P - 1; i++) etas.push(evalAt(c, c.U[i])[0]);
  let worst = 0, at = 0; for (const e of etas){ const d = Math.abs(valueAt(b, e) - valueAt(a, e)); if (d > worst){ worst = d; at = e; } }
  return { dev: worst, eta: at };
}
// curvature from analytic derivatives (derivative control points, Piegl–Tiller §3.3), never finite differences;
// a break is an interior knot where the one-sided curvatures differ by more than 1e-6 relative (A4.3, measured)
function basisAny(U, n, p, t){ let k = p; if (t >= U[n]) { k = n - 1; while (k > p && U[k] === U[k + 1]) k--; } else while (k < n - 1 && t >= U[k + 1]) k++;
  const N = [1], L = [], R = []; for (let j = 1; j <= p; j++){ L[j] = t - U[k + 1 - j]; R[j] = U[k + j] - t; let saved = 0;
    for (let r = 0; r < j; r++){ const den = R[r + 1] + L[j - r], tmp = den ? N[r] / den : 0; N[r] = saved + R[r + 1] * tmp; saved = L[j - r] * tmp; } N[j] = saved; }
  return { k, N }; }
function derivCurve(U, X, Y, p){ const n = X.length, Q = []; for (let i = 0; i < n - 1; i++){ const d = U[i + p + 1] - U[i + 1], f = d ? p / d : 0; Q.push([f * (X[i + 1] - X[i]), f * (Y[i + 1] - Y[i])]); }
  return { U:U.slice(1, -1), X:Q.map(q => q[0]), Y:Q.map(q => q[1]), p:p - 1 }; }
function evalAny(c, t){ const { k, N } = basisAny(c.U, c.X.length, c.p, t); let x = 0, y = 0; for (let j = 0; j <= c.p; j++){ x += N[j] * c.X[k - c.p + j]; y += N[j] * c.Y[k - c.p + j]; } return [x, y]; }
function curvatureBreaks(c){ const d1 = derivCurve(c.U, c.X, c.Y, P), d2 = derivCurve(d1.U, d1.X, d1.Y, d1.p);
  const kappa = t => { const a = evalAny(d1, t), b = evalAny(d2, t); return (a[0] * b[1] - a[1] * b[0]) / Math.pow(Math.hypot(a[0], a[1]), 3); };
  let breaks = 0; for (let i = P + 1; i < c.U.length - P - 1; i++){ const t = c.U[i]; if (t === c.U[i - 1]) continue; const l = kappa(t - 1e-9), r = kappa(t + 1e-9); if (Math.abs(l - r) > 1e-6 * Math.max(1, Math.abs(l))) breaks++; }
  return breaks; }
// ================================================================ the three verbs (design §6.4)
function nextIds(ids, count){ let max = -1; ids.forEach(id => { const m = /^cv-(\d+)$/.exec(id); if (m) max = Math.max(max, +m[1]); }); return Array.from({ length:count }, () => `cv-${++max}`); }
function spacingKnots(c, n){                                  // the default (DR-PV-6 A): the new interior knots follow the current knot spacing
  const old = [...new Set(c.U)], m = old.length - 1, U = [0, 0, 0, 0];
  for (let i = 1; i <= n - 4; i++){ const s = i / (n - 3) * m, j = Math.min(m - 1, Math.floor(s)), w = s - j; U.push(old[j] + w * (old[j + 1] - old[j])); }
  U.push(1, 1, 1, 1); return U; }
function rebuild(c, n, keepSpacing){                          // knots by the current spacing (or uniform); η = the old curve's η at the new Greville parameters; ordinates by least squares
  const U = keepSpacing ? spacingKnots(c, n) : uniformKnots(n), X = greville(U, n).map(t => evalAt(c, t)[0]); X[0] = 0; X[n - 1] = 1;
  const pins = [[0, c.Y[0]], [n - 1, c.Y[c.Y.length - 1]]]; if (c.Y[1] === c.Y[0]) pins.push([1, c.Y[0]]);
  const etas = Array.from({ length:401 }, (_, i) => i / 400), Y = fitOrdinates(U, X, etas, etas.map(e => valueAt(c, e)), pins);
  const fresh = nextIds(c.ids, n - 2), ids = [c.ids[0], ...fresh, c.ids[c.ids.length - 1]];
  const out = curve(U, X, Y, ids), o = oracle(c, out); return { curve:out, dev:o.dev, eta:o.eta, breaksBefore:curvatureBreaks(c), breaksAfter:curvatureBreaks(out) };
}
function addPoint(c, eta){                                    // Boehm, one insertion at t* with x(t*) = η
  const t = paramAt(c, eta), n = c.X.length; let k = findSpan(c.U, n, t);
  const U = [...c.U.slice(0, k + 1), t, ...c.U.slice(k + 1)], X = [], Y = [];
  for (let i = 0; i <= k - P; i++){ X.push(c.X[i]); Y.push(c.Y[i]); }
  for (let i = k - P + 1; i <= k; i++){ const a = (t - c.U[i]) / (c.U[i + P] - c.U[i]); X.push((1 - a) * c.X[i - 1] + a * c.X[i]); Y.push((1 - a) * c.Y[i - 1] + a * c.Y[i]); }
  for (let i = k; i < n; i++){ X.push(c.X[i]); Y.push(c.Y[i]); }
  const id = nextIds(c.ids, 1)[0], ids = [...c.ids.slice(0, k - 1), id, ...c.ids.slice(k - 1)];
  const out = curve(U, X, Y, ids), o = oracle(c, out); return { curve:out, dev:o.dev, index:k - 1, moved:[k - 2, k] };
}
function removePoint(c, i){                                   // drop the knot at the vertex's middle (r = i + 2); refit the two replacement vertices
  const n = c.X.length, r = i + 2, U = c.U.filter((_, j) => j !== r), m = n - 1, G = greville(U, m);
  const X = [], Y = [], free = [i - 1, i];
  for (let j = 0; j < m; j++){ if (free.includes(j)) { X.push(evalAt(c, G[j])[0]); Y.push(0); } else { const o = j < i - 1 ? j : j + 1; X.push(c.X[o]); Y.push(c.Y[o]); } }

  <figure><figcaption>Right-click (Control-click) on trailing-edge point 6 of 10.</figcaption><div class="menu" role="menu" aria-label="Point">
    <div role="menuitem">Make Anchor Point</div><div role="menuitem" class="dis" aria-disabled="true">Make Control Point</div><div role="menuitem" class="dis" aria-disabled="true">Tangent ▸</div><hr><div role="menuitem">Remove Point<kbd>⌫</kbd></div><div role="menuitem">Rebuild Trailing Edge…</div><hr><div role="menuitem">Fit</div></div></figure>
  <figure><figcaption>The same menu on point 3 of the 4-point trailing edge (screen 6): Remove Point is disabled and says why.</figcaption><div class="menu" role="menu" aria-label="Point at the floor">
    <div role="menuitem" class="dis" aria-disabled="true">Make Anchor Point</div><div role="menuitem" class="dis" aria-disabled="true">Make Control Point</div><div role="menuitem" class="dis" aria-disabled="true">Tangent ▸</div><hr><div role="menuitem" class="dis" aria-disabled="true">Remove Point<kbd>⌫</kbd></div><span class="why">A curve needs at least 4 points.</span><div role="menuitem">Rebuild Trailing Edge…</div><hr><div role="menuitem">Fit</div></div></figure>
  <figure><figcaption>Right-click on the outline, away from any point. Add Point Here adds it at the press.</figcaption><div class="menu" role="menu" aria-label="Curve">
    <div role="menuitem" class="hi">Add Point Here</div><div role="menuitem">Rebuild Trailing Edge…</div><hr><div role="menuitem">Fit</div></div></figure></div>`; }
function choicesHTML(){
  const rows = Object.entries(MEASURE.rebuildDeviationMm).map(([n, v]) => `<tr><td>${n}</td><td>${f2(v.trailing)} at ${f2(v.trailingAtMm)}</td><td>${f2(v.leading)} at ${f2(v.leadingAtMm)}</td><td>${f2(v.trailingEvenSpacing)}</td></tr>`).join('');
  return `<section class="choices"><h2>Measured on this page</h2>
    <p>Rebuild of the New foil rails (10 points, tip-clustered) to N points: largest change on the A4.5 oracle, in mm, and where (mm from root). Root position, root square tangent and tip position are held exactly. At N = 4 there is no interior knot, so both spacings give the same curve.</p>
    <table class="m"><tr><th>N</th><th>Trailing edge (current spacing, the default)</th><th>Leading edge (current spacing)</th><th>Trailing edge, even spacing (DR-PV-6 option B)</th></tr>${rows}</table>
    <h2 style="margin-top:14px">Choices this page leaves to the operator (DR-PV batch in the design §13)</h2><ol>
    <li><b>DR-PV-3 — does Rebuild refuse above a tolerance?</b> The page lets you apply any N and shows the change. The New foil's elliptical tip costs ${f2(RB[4].te.dev)} mm at 4 points. <b>Recommend:</b> no gate; show the number (Rhino's Rebuild contract); keep the A4.6 10 µm acceptance for conversions only.</li>
    <li><b>DR-PV-5 — one curve per Rebuild, or both edges?</b> The page rebuilds one curve per command (one undo step each). <b>Recommend:</b> one curve now; a "Both edges" choice later if you ask.</li>
    <li><b>DR-PV-6 — keep the current spacing, or space the points evenly?</b> The New foil's points crowd toward its elliptical tip. Keeping that spacing costs ${f2(RB[5].te.dev)} mm at 5 points against ${f2(RB[5].even.dev)} mm evenly spaced, and a rebuild to the same count changes nothing (${f2(RB[10].te.dev)} mm against ${f2(RB[10].even.dev)} mm). <b>Recommend:</b> keep the current spacing (the table's first column).</li></ol></section>`; }
function paint(){
  document.querySelectorAll('section.screen').forEach(secEl => {
    const sc = SCREENS.find(s => s.id === secEl.dataset.id);
    secEl.querySelectorAll('.view').forEach(view => {
      view.querySelectorAll('.plate:not(.vlabel)').forEach(n => n.remove());
      const cv = view.querySelector('canvas'), w = view.clientWidth, h = view.clientHeight, dpr = window.devicePixelRatio || 1;
      cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = C.vp; g.fillRect(0, 0, w, h);
      const out = drawPlan(g, w, h, sc), add = (cls, text) => { const p = document.createElement('div'); p.className = 'plate ' + cls; p.textContent = text; view.appendChild(p); };
      if (!sc.preview) add('probe', out.probe); add('scalebar', out.scale); add('caption', 'Fit Selection · starboard half · aft (mm) down, from root (mm) right');
    });
  });
  const txt = document.body.innerText; MEASURE.leaks = ['NaN', 'undefined', 'Infinity', 'null'].filter(t => txt.includes(t));
  window.__measure = MEASURE;
}
paint();
document.getElementById('theme').addEventListener('click', e => { const d = document.documentElement.dataset.theme !== 'dark'; document.documentElement.dataset.theme = d ? 'dark' : 'light'; e.currentTarget.textContent = d ? 'Light theme' : 'Dark theme'; e.currentTarget.setAttribute('aria-pressed', String(d)); });
</script>
</body>
