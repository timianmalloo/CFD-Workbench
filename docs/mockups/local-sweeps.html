<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area 4 — Local-Tier Sweeps &amp; Performance Curves (Review Mockup)</title>
<!--
  Self-contained, dependency-free interactive review mockup for Area 4 Local-Tier Sweeps & Performance Curves
  (docs/design/local-sweeps.md; XS-01, XS-03, ANA-08, ANA-16, ANA-19, RES-04, LAB-01).
  All aerodynamic and derived-condition numbers are computed live in-page from the Example foil dimensions
  (b = 0.900 m, c_ref = 0.120 m, S_ref = 0.108 m^2, AR = 7.50, -2 deg tip twist) and ITTC 7.5-02-01-03 Rev 03
  seawater at 15 C (rho = 1026.02 kg/m^3, nu = 1.1892e-6 m^2/s, p_v = 1670.9 Pa).
  Illustrative fixture only; zero network requests, zero external assets.
-->
<style>
:root {
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --primary: #006c67; --on-primary: #ffffff;
  --canvas: #f0f2f1; --surface: #fbfcfb; --soft: #e8edeb;
  --ink: #1b2929; --mute: #526362;
  --line: #c9d3cf; --control: #788d87; --selection: #d8eeea;
  --success: #24653f; --warning: #895900; --danger: #a92e37;
  --focus: #006c67;
  --s0: #006c67; --s1: #011959; --s2: #895900; --s3: #590008;
  --band-fill: color-mix(in srgb, var(--primary) 14%, transparent);
  --band-goal: color-mix(in srgb, var(--warning) 14%, transparent);
  --fast: 120ms; --ease: cubic-bezier(0.2, 0, 0, 1);
}
:root[data-theme="dark"] {
  --primary: #88d8c6; --on-primary: #172326;
  --canvas: #172326; --surface: #1e2d31; --soft: #2a3d40;
  --ink: #ebf3f0; --mute: #b2c4bf;
  --line: #49605b; --control: #79928c; --selection: #274c47;
  --success: #92d1a5; --warning: #efc576; --danger: #ffaeb5;
  --focus: #88d8c6;
  --s0: #88d8c6; --s1: #f19d6b; --s2: #efc576; --s3: #faccfa;
  --band-fill: color-mix(in srgb, var(--primary) 18%, transparent);
  --band-goal: color-mix(in srgb, var(--warning) 16%, transparent);
}
:root[data-theme="contrast"] {
  --primary: #ffee58; --on-primary: #000000;
  --canvas: #000000; --surface: #000000; --soft: #000000;
  --ink: #ffffff; --mute: #ffffff;
  --line: #ffffff; --control: #ffffff; --selection: #000000;
  --success: #92d1a5; --warning: #ffee58; --danger: #ffaeb5;
  --focus: #ffee58;
  --s0: #ffee58; --s1: #ffffff; --s2: #66ddc8; --s3: #ffaeb5;
  --band-fill: color-mix(in srgb, var(--primary) 16%, transparent);
  --band-goal: color-mix(in srgb, var(--ink) 14%, transparent);
}
:root[data-motion="reduced"] *, :root[data-motion="reduced"] *::before, :root[data-motion="reduced"] *::after {
  transition: none !important; animation: none !important;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 13px/1.45 var(--font); }
button, input, select { font: inherit; color: inherit; }
button {
  min-height: 28px; padding: 3px 10px; border: 1px solid var(--control); border-radius: 4px;
  background: var(--surface); color: var(--ink); cursor: pointer;
  transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease);
}
button:hover:not(:disabled) { background: var(--soft); }
button.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 600; }
button.primary:hover:not(:disabled) { filter: brightness(1.06); }
button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 600; }
button:disabled, input:disabled, select:disabled { opacity: 0.55; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}

/* Review harness */
.harness {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.harness-title { display: flex; flex-direction: column; gap: 2px; margin-right: 8px; }
.harness-title h1 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.25; }
.harness-title span { font-size: 11px; color: var(--mute); }
.harness fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.harness legend { float: left; font-size: 11px; font-weight: 600; color: var(--mute); margin-right: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
.harness button { min-height: 26px; padding: 2px 8px; font-size: 12px; }

/* Shell top bar */

/* Cards / panels inside workbench (flat structural joins) */

<body>
<div class="harness" role="region" aria-label="Review harness">
  <div class="harness-title">
    <h1>Area 4 — Local-Tier Sweeps &amp; Performance Curves</h1>
    <span>Illustrative fixture · Example foil (b 0.900 m · c_ref 0.120 m · S_ref 0.108 m² · AR 7.50) · zero network</span>
  </div>
  <fieldset><legend>State</legend><span id="h-states"></span></fieldset>
  <fieldset><legend>Persona</legend><span id="h-personas"></span></fieldset>
  <fieldset><legend>Viewport</legend><span id="h-vps"></span></fieldset>
  <fieldset><legend>Theme</legend><span id="h-themes"></span></fieldset>
  <fieldset><legend>Motion</legend><button type="button" id="h-motion" aria-pressed="false">Reduced motion</button></fieldset>
</div>

<div class="stage">
  <div class="shell" id="shell" data-vp="1440" data-persona="designer" role="application" aria-label="CFD Workbench local sweeps mockup">
    <div class="titlebar">
      <span class="docname">example.foil</span>
      <span class="revchip" id="hdr-rev">r5</span>
      <div class="seg" role="group" aria-label="Workbench mode">
        <button type="button" disabled title="CAD mode (inactive in this mockup)">CAD</button>
        <button type="button" disabled title="Single-point Analysis mode (inactive in this mockup)">Analysis</button>
        <button type="button" aria-pressed="true">Sweeps</button>
      </div>
      <div class="subtabs" role="tablist" aria-label="Sweep areas" id="subtabs"></div>
      <div class="spacer"></div>
      <span class="tier-pill" id="hdr-tier">VLM + strip · local calculation</span>
    </div>

    <div class="persona-bar" id="persona-bar" aria-live="polite"></div>
    <div id="banner-slot"></div>

    <div class="work">
      <aside class="left-dock" aria-label="Experiments and storage">
        <div class="dock-head"><span>Sweeps</span><span class="muted" id="dock-count">0</span></div>
        <div class="dock-body" id="left-body"></div>
      </aside>

      <main class="main-pane" aria-label="Sweep workspace">
        <div class="main-scroll" id="main-body"></div>
      </main>

      <aside class="right-dock" aria-label="Selected case inspector">
        <div class="dock-head"><span>Inspector</span><span class="muted" id="insp-sub">—</span></div>
        <div class="dock-body" id="right-body"></div>
      </aside>
    </div>

    <div class="statusbar" role="status" aria-live="polite" id="statusbar"></div>
  </div>

  <section class="audit" id="audit" aria-label="Live contrast and rule audit"></section>
</div>

<script>
"use strict";

// ---- Physical constants & Example foil (Verified in OperatingPoint.cs, WaterTable.cs, area3-analysis.html) ----
const KN_TO_MS = 1 / 1.9438444924406;
const G = 9.80665;
const P_ATM = 101325.0;
const FOIL = { b: 0.900, cRef: 0.120, sRef: 0.108, ar: 7.50, meanTwistDeg: -0.65, alphaL0Deg: 0.0 };
const WATER_15_SALT = {
  tempC: 15.0, salinity: 35.16504, rho: 1026.02, nu: 1.1892e-6, pv: 1670.9,
  source: "ITTC 7.5-02-01-03 Rev 03", label: "Salt · 15 °C"
};
const SPEEDS_KN = [10, 14, 18];
const ALPHAS_DEG = [0, 2, 4, 6];
const MAX_BYTES = 32_000_000;

// ---- Live physics derivations (Illustrative local model matching Example foil trends) ----
function deriveConditions(speedMs, hRef, water) {
  const moving = speedMs > 0;
  const q = moving ? 0.5 * water.rho * speedMs * speedMs : null;
  const reRef = moving ? (speedMs * FOIL.cRef) / water.nu : null;
  const hc = hRef !== null ? hRef / FOIL.cRef : null;
  const frH = (moving && hRef !== null) ? speedMs / Math.sqrt(G * hRef) : null;
  const sigma = (moving && hRef !== null) ? (P_ATM + water.rho * G * hRef - water.pv) / q : null;
  return { q, reRef, hc, frH, sigma };
}

function fixedVlmBasis(hRef) {
  // Mirrors Labels.FixedVlm(deepWater) (Labels.cs:25-26, 304-305): COPY-223 ("deep water") ONLY when h_ref is set AND h/c >= 5.0; otherwise COPY-224 ("free surface not modelled").
  const hc = hRef !== null ? hRef / FOIL.cRef : null;
  const isDeepWater = hRef !== null && hc >= 5.0;
  if (isDeepWater) return { isDeepWater: true, text: "attached flow; no stall; no ventilation; deep water" };
  const shallowNote = hc !== null ? ` (h/c = ${hc.toFixed(2)} < 5)` : "";
  return { isDeepWater: false, text: "attached flow; no stall; no ventilation; free surface not modelled" + shallowNote };
}

function solveCase(speedKn, alphaDeg, hRef, tier, revOffset) {
  const speedMs = speedKn * KN_TO_MS;
  const cond = deriveConditions(speedMs, hRef, WATER_15_SALT);
  // Helmbold–Diederich base slope with slight finite-lattice washout & Re effect
  const clAlpha = (2 * Math.PI * FOIL.ar) / (2 + Math.sqrt(FOIL.ar * FOIL.ar + 4)); // ~4.827 /rad
  const alphaEffWing = (alphaDeg + FOIL.meanTwistDeg + (revOffset || 0));
  const clEst = clAlpha * (alphaEffWing * Math.PI / 180);
  const clVlm = clEst * 0.978; // lifting-surface factor (area3-analysis.md G-10)
  const cl = tier === "estimator" ? clEst : clVlm;
  const e = tier === "estimator" ? 1.0 : (0.952 - 0.004 * Math.abs(alphaDeg - 3));
  const cdi = (cl * cl) / (Math.PI * FOIL.ar * e);

  // Turbulent-to-transitional strip profile drag band (Ncrit 2 higher drag, Ncrit 4 lower drag)
  const reScale = Math.pow(cond.reRef / 5e5, -0.18);
  const cdProfN4 = (0.0068 + 0.0019 * cl * cl) * reScale;
  const cdProfN2 = (0.0078 + 0.0022 * cl * cl) * reScale;
  const cdWingN4 = cdi + cdProfN4;
  const cdWingN2 = cdi + cdProfN2;

  const ldN4 = cl / cdWingN4;
  const ldN2 = cl / cdWingN2;

  // Pitching moment about frame origin (root LE, +x aft, +z up -> positive My is nose-up; lift aft at ~0.255 c gives negative Cm)
  const xCpOverC = 0.252 + 0.004 * Math.max(0, alphaDeg - 2);
  const cm = tier === "estimator" ? null : (-xCpOverC * cl - 0.006);

  // Governing station -Cp_min for cavitation screening (sheet, 15 % practitioner margin)
  const negCpMin = 0.24 + 0.58 * Math.max(0, cl) + 0.14 * cl * cl;
  const vCrit = hRef !== null ? Math.sqrt((2 * (P_ATM + WATER_15_SALT.rho * G * hRef - WATER_15_SALT.pv)) / (WATER_15_SALT.rho * negCpMin)) : null;

  const liftN = cond.q * FOIL.sRef * cl;
  const diN = cond.q * FOIL.sRef * cdi;
  const dWingN4 = cond.q * FOIL.sRef * cdWingN4;
  const dWingN2 = cond.q * FOIL.sRef * cdWingN2;
  const envelopeOutside = alphaDeg >= 6 && speedKn >= 18;

  return {
    speedKn, speedMs, alphaDeg, hRef, cond,
    cl, cdi, e,
    cdWingN2: tier === "estimator" ? null : cdWingN2,
    cdWingN4: tier === "estimator" ? null : cdWingN4,
    ldN2: tier === "estimator" ? null : ldN2,
    ldN4: tier === "estimator" ? null : ldN4,
    cm, negCpMin, vCrit, liftN, diN,
    dWingN2: tier === "estimator" ? null : dWingN2,
    dWingN4: tier === "estimator" ? null : dWingN4,
    envelope: envelopeOutside
      ? "Outside the method envelope — 4 of 126 strips; exceeded: Cl_local"
      : "Inside the method envelope (|α_eff − α_L0| ≤ 10°, Cl_local ≤ 1.0, sweep ≤ 30°)",
    runKey: fakeKey(speedKn, alphaDeg, hRef, tier, revOffset)
  };
}

function fakeKey(v, a, h, tier, rev) {
  let x = (v * 97 + a * 31 + (h === null ? 7 : Math.round(h * 100)) * 13 + (tier === "estimator" ? 3 : 11) + (rev ? 53 : 0)) >>> 0;
  let out = "";
  for (let i = 0; i < 12; i++) {
    x = (Math.imul(x ^ 0x9e3779b9, 0x85ebca6b) >>> 0);
    out += ((x >>> 28) & 0xf).toString(16);
  }
  return out;
}

function build12Cases(hRef, tier, revOffset) {
  const list = [];
  let idx = 0;
  for (const v of SPEEDS_KN) {
    for (const a of ALPHAS_DEG) {
      list.push(Object.assign({ index: idx++, state: "Completed", failCode: null, failReason: null, attempt: 1 }, solveCase(v, a, hRef, tier, revOffset)));
    }
  }
  return list;
}

function fmt(x, d) {
  if (x === null || x === undefined || !Number.isFinite(x)) return "—";
  return (x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
}
function fmtSci(x) {
  if (x === null || x === undefined || !Number.isFinite(x)) return "—";
  const p = Math.floor(Math.log10(Math.abs(x)));
  const m = x / Math.pow(10, p);
  return `${m.toFixed(2)}e${p >= 0 ? "+" : ""}${p}`;
}
function announce(msg) {
  ui.srMessage = msg;
  if (ui.persona === "screen-reader") renderPersonaBar();
}

function activeSubArea() {
  if (ui.state === "empty" || ui.state === "invalid" || ui.state === "preview") return "experiment";
  if (ui.state === "running") return "run";
  return "results";
}

function getCasesForState() {
  const hRef = ui.state === "depth-unset" ? null : 0.50;
  const revOffset = ui.state === "historical" ? -0.18 : 0;
  const cases = build12Cases(hRef, ui.tier, revOffset);
  if (ui.state === "running") {
    cases.forEach((c, i) => {
      if (i < ui.runCompletedCount) c.state = "Completed";
      else if (i === ui.runCompletedCount) c.state = ui.runCancelled ? "Cancelled" : "Running";
      else c.state = "Pending";
      if (c.state !== "Completed") c.runKey = null;
    });
  } else if (ui.state === "completed") {
    if (!ui.retriedCase) {
      // Interior case #7 (index 6: 14 kn, alpha 4 deg) fails so BOTH vs-alpha and vs-speed curves show an interior non-bridged gap!
      cases[6].state = "Failed";
      cases[6].failCode = "ANA-SOLVE-RESIDUAL";
      cases[6].failReason = "Lattice residual exceeded limit (1.4e−4 > 1e−6) at 14 kn, α 4°.";
      cases[6].runKey = null;
    } else {
      cases[6].attempt = 2;
      cases[6].state = "Completed";
    }
  }
  return cases;
}

            <tr><th>#</th><th class="num">Speed</th><th class="num">α</th><th>Attempt</th><th>State</th><th>Run key</th><th class="num">CL</th><th>Action</th></tr>
          </thead>
          <tbody>
            ${cases.map(c => {
              const bClass = c.state === "Completed" ? "ok" : c.state === "Running" ? "run" : c.state === "Cancelled" ? "warn" : "pend";
              const sym = c.state === "Completed" ? "✓" : c.state === "Running" ? "●" : c.state === "Cancelled" ? "■" : "○";
              return `<tr data-idx="${c.index}" class="${c.index === ui.selectedCase ? "selected" : ""}">
                <td class="mono">${c.index + 1}</td>
                <td class="num">${c.speedKn.toFixed(1)} kn</td>
                <td class="num">${c.alphaDeg.toFixed(1)}°</td>
                <td class="mono">#${c.attempt}</td>
                <td><span class="badge ${bClass}">${sym} ${c.state}</span></td>
                <td class="mono">${c.runKey ? c.runKey : "—"}</td>
                <td class="num">${c.state === "Completed" ? fmt(c.cl, 3) : (c.state === "Running" ? '<div class="skel-bar" aria-label="Running"></div>' : "—")}</td>
                <td>${c.state === "Cancelled" ? `<button type="button" class="retry-inline" data-idx="${c.index}">Retry sample</button>` : `<span class="muted">—</span>`}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>`;

  const cancelBtn = document.getElementById("btn-cancel");
  if (cancelBtn) cancelBtn.onclick = () => { ui.runCancelled = true; announce(`Cancelled local sweep. Preserved ${doneCount} completed cases.`); renderAll(); };
  const resumeBtn = document.getElementById("btn-run-resume");
  if (resumeBtn) resumeBtn.onclick = () => { ui.runCancelled = false; announce("Resumed remaining cases."); renderAll(); };
  const stepBtn = document.getElementById("btn-step");
  if (stepBtn) stepBtn.onclick = () => {
    if (ui.runCompletedCount < 11) { ui.runCompletedCount++; announce(`Case ${ui.runCompletedCount} completed.`); }
    else { ui.state = "completed"; ui.selectedCase = 6; announce("Sweep finished: Completed (11 of 12, 1 failed)."); }
    renderAll();
  };
  document.getElementById("btn-open-results").onclick = () => { ui.state = "completed"; ui.selectedCase = 6; renderAll(); };
  main.querySelectorAll("tbody tr").forEach(tr => tr.addEventListener("click", () => {
    ui.selectedCase = Number(tr.dataset.idx);
    renderAll();
  }));
}

// ---- SVG Performance Curves with STRICT non-bridged gaps (ANA-16, RES-04, UI-17) ----
function buildChartSvg(cases) {
  const W = 720, H = 280, padL = 58, padR = 86, padT = 20, padB = 40;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const styles = getComputedStyle(document.documentElement);
  const colors = [styles.getPropertyValue("--s0").trim(), styles.getPropertyValue("--s1").trim(), styles.getPropertyValue("--s2").trim(), styles.getPropertyValue("--s3").trim()];
  const dashes = ["", "6,3", "2,3", "8,3,2,3"];
  const ink = styles.getPropertyValue("--ink").trim();
  const mute = styles.getPropertyValue("--mute").trim();
  const line = styles.getPropertyValue("--line").trim();
  const danger = styles.getPropertyValue("--danger").trim();
  const warn = styles.getPropertyValue("--warning").trim();

  // Check Estimator unavailability for LD or Cm
  if (ui.tier === "estimator" && (ui.metric === "LD" || ui.metric === "Cm")) {
    const msg = ui.metric === "Cm"
      ? "Unavailable — estimator does not compute pitching moment"
      : "Unavailable — estimator computes induced drag only (no viscous profile drag)";
    return `<div style="padding:36px 16px; text-align:center;">
      <p style="font-weight:600; margin:0 0 6px;">${msg}</p>
      <p class="muted" style="margin:0;">Switch tier to VLM + strip · local calculation, or view CL / CDi (Estimator, e = 1).</p>
    </div>`;
  }

  // Group into series by held variable
  const seriesGroups = ui.xAxis === "alpha"
    ? SPEEDS_KN.map((v, gi) => ({
        name: `${v} kn`, color: colors[gi % colors.length], dash: dashes[gi % dashes.length], shape: gi,
        pts: ALPHAS_DEG.map(a => cases.find(c => c.speedKn === v && c.alphaDeg === a))
      }))
    : ALPHAS_DEG.map((a, gi) => ({
        name: `α ${a}°`, color: colors[gi % colors.length], dash: dashes[gi % dashes.length], shape: gi,
        pts: SPEEDS_KN.map(v => cases.find(c => c.speedKn === v && c.alphaDeg === a))
      }));

  const xVals = ui.xAxis === "alpha" ? ALPHAS_DEG : SPEEDS_KN;
  const xMin = Math.min(...xVals), xMax = Math.max(...xVals);
  const xMap = x => padL + ((x - xMin) / (xMax - xMin || 1)) * plotW;

  // Value accessor per metric (returns { y, yLow?, yHigh?, ySub? } or null for gap)
  function valOf(c) {
    if (!c || c.state !== "Completed" || ui.archivedHistorical) return null;
    if (ui.metric === "CL") return { y: c.cl };
    if (ui.metric === "CD") {
      if (ui.tier === "estimator") return { y: c.cdi };
      return { y: c.cdWingN4, yLow: c.cdWingN4, yHigh: c.cdWingN2, ySub: c.cdi };
    }
    if (ui.metric === "LD") return { y: c.ldN4, yLow: c.ldN2, yHigh: c.ldN4 };
    if (ui.metric === "Cm") return { y: c.cm };
    return null;
  }

  const allY = [];
  for (const g of seriesGroups) for (const c of g.pts) {
    const v = valOf(c);
    if (!v) continue;
    allY.push(v.y);
    if (v.yLow !== undefined) allY.push(v.yLow);
    if (v.yHigh !== undefined) allY.push(v.yHigh);
    if (v.ySub !== undefined) allY.push(v.ySub);
  }
  if (allY.length === 0) {
    return `<div style="padding:36px 16px; text-align:center;">
      <p style="font-weight:600; margin:0 0 6px;">Unavailable — pruned at save (archived sweep). Re-run in a new version to recompute.</p>
      <p class="muted" style="margin:0;">Definition and attempt history remain stored; strip rows were released for save-time retention.</p>
    </div>`;
  }
  let yMin = Math.min(...allY), yMax = Math.max(...allY);
  const yPad = (yMax - yMin || 0.1) * 0.16;
  yMin -= yPad; yMax += yPad;
  const yMap = y => padT + plotH - ((y - yMin) / (yMax - yMin)) * plotH;

  let svg = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${ui.metric} vs ${ui.xAxis === "alpha" ? "incidence alpha" : "speed"} performance curve">`;

  // Optional Goal-state reference band on CL (take-off CL target ~0.65) or cavitation ceiling on Speed
  if (ui.metric === "CL") {
    const bandY1 = yMap(0.68), bandY2 = yMap(0.58);
    if (bandY2 > padT && bandY1 < padT + plotH) {
      const top = Math.max(padT, bandY1), bot = Math.min(padT + plotH, bandY2);
      svg += `<rect x="${padL}" y="${top}" width="${plotW}" height="${Math.max(0, bot - top)}" fill="var(--band-goal)"/>
        <text x="${padL + 6}" y="${top + 12}" fill="${warn}" font-size="10.5" font-weight="600">Goal band · take-off CL 0.58–0.68 (Illustrative)</text>`;
    }
  }
  if (ui.xAxis === "speed" && ui.state !== "depth-unset") {
    const vCavX = xMap(16.8);
    svg += `<line x1="${vCavX}" y1="${padT}" x2="${vCavX}" y2="${padT + plotH}" stroke="${warn}" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="${vCavX - 4}" y="${padT + 12}" text-anchor="end" fill="${warn}" font-size="10" font-weight="600">V_crit ceiling (15 % margin)</text>`;
  }

  // Grid & axes
  for (let i = 0; i <= 4; i++) {
    const yv = yMin + (i / 4) * (yMax - yMin), yy = yMap(yv);
    svg += `<line x1="${padL}" y1="${yy}" x2="${padL + plotW}" y2="${yy}" stroke="${line}" stroke-width="1" stroke-opacity="0.6"/>
      <text x="${padL - 8}" y="${yy + 3.5}" text-anchor="end" fill="${mute}" font-size="10.5" class="mono">${fmt(yv, ui.metric === "CD" ? 4 : (ui.metric === "LD" ? 1 : 2))}</text>`;
  }
  for (const xv of xVals) {
    const xx = xMap(xv);
    svg += `<line x1="${xx}" y1="${padT}" x2="${xx}" y2="${padT + plotH}" stroke="${line}" stroke-width="1" stroke-opacity="0.4"/>
      <text x="${xx}" y="${padT + plotH + 16}" text-anchor="middle" fill="${mute}" font-size="10.5" class="mono">${ui.xAxis === "alpha" ? xv + "°" : xv + " kn"}</text>`;
  }
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="${ink}" stroke-width="1.2"/>`;
  svg += `<line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="${ink}" stroke-width="1.2"/>`;

  const yTitle = ui.metric === "CL" ? "CL (–)"
    : ui.metric === "CD" ? (ui.tier === "estimator" ? "CDi (–)" : "CD Wing only, Ncrit 2–4 (–)")
    : ui.metric === "LD" ? "Wing-only CL/CD, Ncrit 2–4 (–)"
    : "Cm about frame origin (–)";
  const xTitle = ui.xAxis === "alpha" ? "Incidence α (°)" : "Speed V (kn)";
  svg += `<text x="${padL + plotW / 2}" y="${H - 6}" text-anchor="middle" fill="${ink}" font-size="11" font-weight="600">${xTitle}</text>`;
  svg += `<text x="14" y="${padT + plotH / 2}" text-anchor="middle" fill="${ink}" font-size="11" font-weight="600" transform="rotate(-90 14 ${padT + plotH / 2})">${yTitle}</text>`;

  // Draw each series in contiguous non-gap segments (NEVER bridging across a failed/missing sample!)
  for (const g of seriesGroups) {
    let segMain = [], segBandLo = [], segBandHi = [], segSub = [];
    let lastValid = null;

    function flushSegment() {
      if (segBandLo.length >= 2 && segBandHi.length >= 2) {
        const poly = segBandLo.concat(segBandHi.slice().reverse()).map(p => p.join(",")).join(" ");
        svg += `<polygon points="${poly}" fill="${g.color}" fill-opacity="0.14"/>`;
        svg += `<polyline fill="none" stroke="${g.color}" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="3,2" points="${segBandHi.map(p => p.join(",")).join(" ")}"/>`;
      }
      if (segSub.length >= 2) {
        svg += `<polyline fill="none" stroke="${g.color}" stroke-width="1.2" stroke-dasharray="2,3" stroke-opacity="0.75" points="${segSub.map(p => p.join(",")).join(" ")}"/>`;
      }
      if (segMain.length >= 2) {
        svg += `<polyline fill="none" stroke="${g.color}" stroke-width="2.2" ${g.dash ? `stroke-dasharray="${g.dash}"` : ""} points="${segMain.map(p => p.join(",")).join(" ")}"/>`;
      }
      segMain = []; segBandLo = []; segBandHi = []; segSub = [];
    }

    for (const c of g.pts) {
      const xv = ui.xAxis === "alpha" ? c.alphaDeg : c.speedKn;
      const xx = xMap(xv);
      const v = valOf(c);
      if (!v) {
        // Explicit gap: flush prior segment so zero line bridges across this missing point!
        flushSegment();
        const gy = padT + plotH - 12;
        const isSel = c.index === ui.selectedCase;
        svg += `<g class="chart-pt" data-idx="${c.index}" tabindex="0" role="button" aria-label="Gap: case ${c.index + 1}, ${c.speedKn} kn, alpha ${c.alphaDeg} degrees, Failed (${c.failCode})">
          <circle cx="${xx}" cy="${gy}" r="${isSel ? 10 : 7}" fill="var(--surface)" stroke="${danger}" stroke-width="${isSel ? 2.5 : 1.5}" stroke-dasharray="3,2"/>
          <line x1="${xx - 4}" y1="${gy - 4}" x2="${xx + 4}" y2="${gy + 4}" stroke="${danger}" stroke-width="2"/>
          <line x1="${xx + 4}" y1="${gy - 4}" x2="${xx - 4}" y2="${gy + 4}" stroke="${danger}" stroke-width="2"/>
          <text x="${xx}" y="${gy - 11}" text-anchor="middle" fill="${danger}" font-size="10" font-weight="700">Gap (${g.name})</text>
        </g>`;
        continue;
      }
      const yy = yMap(v.y);
      segMain.push([xx, yy]);
      if (v.yLow !== undefined && v.yHigh !== undefined) {
        segBandLo.push([xx, yMap(v.yLow)]);
        segBandHi.push([xx, yMap(v.yHigh)]);
      }
      if (v.ySub !== undefined) segSub.push([xx, yMap(v.ySub)]);
      lastValid = { x: xx, y: yy };
    }
    flushSegment();

    // Direct series label at last valid point
    if (lastValid) {
      svg += `<text x="${Math.min(W - 6, lastValid.x + 8)}" y="${lastValid.y + 3.5}" fill="${g.color}" font-size="10.5" font-weight="600">${g.name}</text>`;
    }

    // Markers (distinct shapes per series; selected point gets outer ring)
    for (const c of g.pts) {
      const v = valOf(c);
      if (!v) continue;
      const xv = ui.xAxis === "alpha" ? c.alphaDeg : c.speedKn;
      const xx = xMap(xv), yy = yMap(v.y);
      const isSel = c.index === ui.selectedCase;
      const r = isSel ? 5.5 : 4;
      let marker = "";
      if (g.shape === 0) marker = `<circle cx="${xx}" cy="${yy}" r="${r}" fill="${g.color}" stroke="var(--surface)" stroke-width="1.2"/>`;
      else if (g.shape === 1) marker = `<rect x="${xx - r}" y="${yy - r}" width="${2 * r}" height="${2 * r}" fill="${g.color}" stroke="var(--surface)" stroke-width="1.2"/>`;
      else if (g.shape === 2) marker = `<polygon points="${xx},${yy - r - 1} ${xx + r + 1},${yy} ${xx},${yy + r + 1} ${xx - r - 1},${yy}" fill="${g.color}" stroke="var(--surface)" stroke-width="1.2"/>`;
      else marker = `<polygon points="${xx},${yy - r - 1} ${xx + r + 1},${yy + r} ${xx - r - 1},${yy + r}" fill="${g.color}" stroke="var(--surface)" stroke-width="1.2"/>`;

      svg += `<g class="chart-pt" data-idx="${c.index}" tabindex="0" role="button" aria-label="Case ${c.index + 1}, ${c.speedKn} kn, alpha ${c.alphaDeg} degrees, ${ui.metric} ${fmt(v.y, 4)}">
        ${isSel ? `<circle cx="${xx}" cy="${yy}" r="9" fill="none" stroke="${ink}" stroke-width="2"/>` : ""}
        ${marker}
      </g>`;
    }
  }
  svg += `</svg>`;
  return svg;
}

// ---- Results view (ANA-08, ANA-16, RES-04, UI-17) ----
function renderResultsView(cases) {
  const main = document.getElementById("main-body");
  const isDepthUnset = ui.state === "depth-unset";
  const subtitle = ui.metric === "Cm"
    ? "Cm about frame origin (root LE, c_ref = S/b, positive nose-up)"
    : ui.metric === "CD"
      ? (ui.tier === "estimator" ? "CDi (Estimator, elliptic loading e = 1) · no viscous profile drag" : "Wing only: induced (VLM + strip) plus profile (polar, Ncrit 2–4 band; dotted: CDi Trefftz). Not a craft total.")
      : ui.metric === "LD"
        ? "Wing only: lift over wing drag (Ncrit 2–4 band). Not a craft CL/CD."
        : `Held: Salt 15 °C · ${isDepthUnset ? "depth unset (free surface not modelled)" : "h_ref 0.50 m (root LE)"} · S_ref 0.108 m² · b 0.900 m`;

  main.innerHTML = `
    <div class="panel">
      <div class="chart-toolbar">
        <div class="seg" role="group" aria-label="Performance curve metric">
          ${[
            ["CL", "CL"],
            ["CD", ui.tier === "estimator" ? "CDi (Est.)" : "CD (Wing only)"],
            ["LD", "L/D (Wing only)"],
            ["Cm", "Cm"]
          ].map(([m, lbl]) => `<button type="button" data-m="${m}" aria-pressed="${ui.metric === m}">${lbl}</button>`).join("")}
        </div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <div class="seg" role="group" aria-label="X axis">
            <button type="button" data-x="alpha" aria-pressed="${ui.xAxis === "alpha"}">vs α (°)</button>
            <button type="button" data-x="speed" aria-pressed="${ui.xAxis === "speed"}">vs Speed (kn)</button>
          </div>
          <button type="button" id="btn-tier-res">${ui.tier === "vlm-strip" ? "Tier: VLM + strip" : "Tier: Estimator"}</button>
          <button type="button" id="btn-table-twin" aria-pressed="${ui.showTable}">${ui.showTable ? "Hide table twin" : "Show table"}</button>
        </div>
      </div>

      <div class="muted" style="margin-bottom:6px;">${subtitle} <span class="rev-tag">ANA-16 · RES-04 · UI-17</span></div>

      <div class="chart-box" id="chart-box">
        ${buildChartSvg(cases)}
        <div class="chart-legend">
          <span class="legend-item"><strong>Basis:</strong> ${fixedVlmBasis(isDepthUnset ? null : 0.50).text}</span>
          ${isDepthUnset ? `<span class="legend-item"><strong>Cavitation ceiling:</strong> Unavailable — depth not set</span>` : ""}
          <span class="legend-item"><strong>Gap rule:</strong> Failed/pruned cases break the curve; zero interpolation across gaps.</span>
        </div>
      </div>

      ${ui.showTable ? `<div class="tbl-wrap" style="margin-top:10px; max-height:240px;">
        <table aria-label="Performance curve table twin">
          <thead>
            <tr>
              <th>#</th><th class="num">V (kn)</th><th class="num">α (°)</th><th>State</th>
              <th class="num">CL</th><th class="num">CDi</th><th class="num">CD (Ncrit 2–4)</th>
              <th class="num">Wing L/D (Ncrit 2–4)</th><th class="num">Cm (origin)</th><th class="num">σ</th>
            </tr>
          </thead>
          <tbody>
            ${cases.map(c => {
              const fail = c.state !== "Completed";
              const pruned = ui.archivedHistorical;
              return `<tr data-idx="${c.index}" class="${c.index === ui.selectedCase ? "selected" : ""} ${fail ? "failed-row" : ""}">
                <td class="mono">${c.index + 1}</td>
                <td class="num">${c.speedKn.toFixed(1)}</td>
                <td class="num">${c.alphaDeg.toFixed(1)}°</td>
                <td>${fail ? `<span class="badge fail">× Failed (${c.failCode})</span>` : (pruned ? `<span class="badge warn">Pruned</span>` : `<span class="badge ok">✓ Completed</span>`)}</td>
                <td class="num">${fail || pruned ? "—" : fmt(c.cl, 4)}</td>
                <td class="num">${fail || pruned ? "—" : fmt(c.cdi, 5)}</td>
                <td class="num">${fail || pruned ? "—" : (c.cdWingN4 === null ? "Unavailable" : `${fmt(c.cdWingN4, 4)}–${fmt(c.cdWingN2, 4)}`)}</td>
                <td class="num">${fail || pruned ? "—" : (c.ldN4 === null ? "Unavailable" : `${fmt(c.ldN2, 1)}–${fmt(c.ldN4, 1)}`)}</td>
                <td class="num">${fail || pruned ? "—" : (c.cm === null ? "Unavailable" : fmt(c.cm, 4))}</td>
                <td class="num">${isDepthUnset ? "Unavailable" : fmt(c.cond.sigma, 2)}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>` : ""}
    </div>

    <div class="panel">
      <h3>Small multiples — linked case selection (${cases.length} cases) <span class="rev-tag">ANA-08 · RES-04 · UI-13</span></h3>
      <div class="multiples">
        ${cases.map(c => {
          const fail = c.state !== "Completed";
          const pruned = ui.archivedHistorical;
          const isSel = c.index === ui.selectedCase;
          return `<button type="button" class="mcard ${isSel ? "selected" : ""} ${fail ? "failed" : ""}" data-idx="${c.index}"
            aria-label="Case ${c.index + 1}, ${c.speedKn} knots, alpha ${c.alphaDeg} degrees, ${fail ? "Failed " + c.failCode : "CL " + fmt(c.cl, 3)}">
            <div class="mhead"><span>${c.speedKn} kn · ${c.alphaDeg}°</span><span>${fail ? "×" : (pruned ? "!" : "✓")}</span></div>
            <div class="mval">${fail ? "Gap (Failed)" : (pruned ? "Pruned" : "CL " + fmt(c.cl, 3))}</div>
            <div class="msub">${fail ? c.failCode : (pruned ? "Archived" : (c.ldN4 ? `L/D ${fmt(c.ldN2, 1)}–${fmt(c.ldN4, 1)}` : `CDi ${fmt(c.cdi, 4)}`))}</div>
          </button>`;
        }).join("")}
      </div>
    </div>`;

  main.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => { ui.metric = b.dataset.m; announce(`Chart metric switched to ${ui.metric}.`); renderAll(); }));
  main.querySelectorAll("[data-x]").forEach(b => b.addEventListener("click", () => { ui.xAxis = b.dataset.x; announce(`X axis switched to ${ui.xAxis}.`); renderAll(); }));
  document.getElementById("btn-tier-res").onclick = () => { ui.tier = ui.tier === "vlm-strip" ? "estimator" : "vlm-strip"; announce(`Switched tier to ${ui.tier}.`); renderAll(); };
  document.getElementById("btn-table-twin").onclick = () => { ui.showTable = !ui.showTable; announce(ui.showTable ? "Table twin opened." : "Table twin hidden."); renderAll(); };
  main.querySelectorAll("[data-idx]").forEach(el => {
    const pick = () => { ui.selectedCase = Number(el.dataset.idx); const c = cases[ui.selectedCase]; announce(`Selected case ${c.index + 1}: ${c.speedKn} kn, alpha ${c.alphaDeg} deg, ${c.state}.`); renderAll(); };
    el.addEventListener("click", pick);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
}

// ---- Right Inspector (synchronized with selected case, ANA-08) ----
function renderInspector(cases) {
  const sub = document.getElementById("insp-sub");
  const body = document.getElementById("right-body");
  if (ui.state === "empty" || ui.state === "invalid") {
    sub.textContent = "—";
    body.innerHTML = `<p class="muted">${ui.state === "empty" ? "Define a sweep to inspect case conditions." : "Resolve invalid inputs to preview case conditions."}</p>`;
    return;
  }
  const c = cases[ui.selectedCase] || cases[0];
  sub.textContent = `Case ${c.index + 1} of ${cases.length}`;
  const isDepthUnset = ui.state === "depth-unset";
  const isPreview = ui.state === "preview";
  const isFailed = c.state === "Failed";
  const isIncomplete = c.state !== "Completed";
  const isPruned = ui.archivedHistorical;

  let html = `<div class="panel">
    <h3>Case ${c.index + 1} · ${c.speedKn.toFixed(1)} kn · α ${c.alphaDeg.toFixed(1)}°</h3>
    <div style="margin-bottom:6px;">
      <span class="badge ${isFailed ? "fail" : (isIncomplete ? "warn" : (ui.state === "historical" ? "warn" : "ok"))}">
        ${isFailed ? "× Failed" : isPreview ? "Preview" : (ui.state === "historical" ? "Historical" : c.state)}
      </span>
      <span class="muted" style="margin-left:6px;">Attempt #${c.attempt}</span>
    </div>
    ${isFailed ? `<div class="panel" style="border-color: var(--danger); margin:6px 0; background: var(--soft);">
      <div style="color: var(--danger); font-weight:600;">${c.failCode}</div>
      <div class="muted" style="margin:3px 0 8px;">${c.failReason}</div>
      <button type="button" class="primary" id="btn-retry-insp">Retry sample</button>
    </div>` : ""}
    ${isPruned ? `<p class="muted">Unavailable — pruned at save (archived sweep). Re-run in a new version to recompute.</p>` : ""}
  </div>`;

  html += `<div class="panel">
    <h3>Derived conditions</h3>
    <div class="prow"><span class="pk">Speed V</span><span class="pv">${fmt(c.speedMs, 3)} m/s</span></div>
    <div class="prow"><span class="pk">Dynamic pressure q</span><span class="pv">${fmt(c.cond.q, 1)} Pa</span></div>
    <div class="prow"><span class="pk">Re_ref</span><span class="pv">${fmtSci(c.cond.reRef)}</span></div>
    <div class="prow"><span class="pk">Depth h_ref</span><span class="pv ${isDepthUnset ? "text" : ""}">${isDepthUnset ? "Unavailable — depth not set" : "0.500 m (root LE)"}</span></div>
    <div class="prow"><span class="pk">h / c</span><span class="pv ${isDepthUnset ? "text" : ""}">${isDepthUnset ? "Unavailable — depth not set" : fmt(c.cond.hc, 2)}</span></div>
    <div class="prow"><span class="pk">Fr_h</span><span class="pv ${isDepthUnset ? "text" : ""}">${isDepthUnset ? "Unavailable — depth not set" : fmt(c.cond.frH, 2)}</span></div>
    <div class="prow"><span class="pk">σ (cavitation)</span><span class="pv ${isDepthUnset ? "text" : ""}">${isDepthUnset ? "Unavailable — depth not set" : fmt(c.cond.sigma, 2)}</span></div>
    <div class="prow"><span class="pk">V_crit (sheet screen)</span><span class="pv ${isDepthUnset ? "text" : ""}">${isDepthUnset ? "Unavailable — depth not set" : fmt(c.vCrit / KN_TO_MS, 1) + " kn"}</span></div>
  </div>`;

  if (!isPreview && !isIncomplete && !isPruned) {
    html += `<div class="panel">
      <h3>Wing result (derived from run)</h3>
      <div class="prow"><span class="pk">CL</span><span class="pv">${fmt(c.cl, 4)}</span></div>
      <div class="prow"><span class="pk">CDi (Trefftz)</span><span class="pv">${fmt(c.cdi, 5)}</span></div>
      <div class="prow"><span class="pk">CD (Wing only, Ncrit 2–4)</span><span class="pv ${c.cdWingN4 === null ? "text" : ""}">${c.cdWingN4 === null ? "Unavailable — induced only" : `${fmt(c.cdWingN4, 4)}–${fmt(c.cdWingN2, 4)}`}</span></div>
      <div class="prow"><span class="pk">Wing-only CL/CD</span><span class="pv ${c.ldN4 === null ? "text" : ""}">${c.ldN4 === null ? "Unavailable — induced only" : `${fmt(c.ldN2, 1)}–${fmt(c.ldN4, 1)}`}</span></div>
      <div class="prow"><span class="pk">Craft Total drag</span><span class="pv text">Unavailable — missing: junction, mast, wave, spray</span></div>
      <div class="prow"><span class="pk">Cm (frame origin)</span><span class="pv ${c.cm === null ? "text" : ""}">${c.cm === null ? "Unavailable — estimator" : fmt(c.cm, 4)}</span></div>
      <div class="prow"><span class="pk">e (computed)</span><span class="pv">${fmt(c.e, 3)}</span></div>
      <div class="prow"><span class="pk">Lift L</span><span class="pv">${fmt(c.liftN, 1)} N</span></div>
      <div class="prow"><span class="pk">Envelope</span><span class="pv text">${c.envelope}</span></div>
      <div class="prow"><span class="pk">Run key</span><span class="pv">${c.runKey}</span></div>
    </div>`;
  }
  body.innerHTML = html;

  const rBtn = document.getElementById("btn-retry-insp");
  if (rBtn) rBtn.onclick = () => { ui.retriedCase = true; announce("Retry sample appended Attempt #2 for case 7: Completed."); renderAll(); };
}

function renderStatusBar(cases) {
  const sb = document.getElementById("statusbar");
  let msg = "Ready", cls = "", item = "Sweep: none", actionHtml = "";
  if (ui.state === "empty") { msg = "No sweep defined yet."; item = "Sweep: none"; }
  else if (ui.state === "invalid") { msg = "Queue blocked: fix 3 invalid sweep inputs."; cls = "danger"; item = "Sweep: blocked"; }
  else if (ui.state === "preview") { msg = "Preview ready: 12 unique cases (3 speeds × 4 angles)."; item = "Sweep: Draft (12)"; }
  else if (ui.state === "running") {
    if (ui.runCancelled) { msg = `Cancelled — ${ui.runCompletedCount} of 12 completed cases preserved.`; cls = "warn"; item = `Sweep: Cancelled (${ui.runCompletedCount}/12)`; }
    else { msg = `Running ${ui.runCompletedCount + 1} of 12 · local · in-process`; item = `Sweep: Running ${ui.runCompletedCount + 1}/12`; actionHtml = `<button type="button" class="sb-btn" id="sb-cancel">Cancel</button>`; }
  }
  else if (ui.state === "completed") {
    if (ui.retriedCase) { msg = "Retry complete — Attempt #2 succeeded. Completed (12 of 12)."; item = "Sweep: Completed (12/12)"; }
    else { msg = "Completed (11 of 12) — 1 failed case shown as a gap."; cls = "danger"; item = "Sweep: Completed (11/12)"; }
  }
  else if (ui.state === "depth-unset") { msg = "Depth unset — free surface not modelled; σ, Fr_h, V_crit Unavailable."; item = "Sweep: Completed (depth unset)"; }
  else if (ui.state === "historical") { msg = "Historical — surface changed (r4 → r5, a twist point moved)."; cls = "warn"; item = "Sweep: Historical"; }

  sb.innerHTML = `<div class="sb-msg ${cls}"><span>${msg}</span>${actionHtml}</div>
    <div class="sb-item ${cls === "warn" ? "warn" : ""}">${item}</div>
    <div class="sb-item">Units: kn · N</div>
    <div class="sb-item">32.0 MB cap</div>`;
  const sc = document.getElementById("sb-cancel");
  if (sc) sc.onclick = () => { ui.runCancelled = true; announce("Cancelled local sweep from status strip."); renderAll(); };
}

// ---- Live WCAG contrast + LAB-01 + XS-03 audit ----
function lum(hex) {
  const c = hex.trim().replace("#", "");
  if (c.length !== 6) return 0;
  const v = [0, 2, 4].map(i => parseInt(c.slice(i, i + 2), 16) / 255)
    .map(x => x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
function contrastRatio(a, b) {
  const l1 = lum(a), l2 = lum(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}

function renderAudit() {
  const s = getComputedStyle(document.documentElement);
  const t = name => s.getPropertyValue(name).trim();
  const pairs = [
    ["ink on surface", "--ink", "--surface", 4.5],
    ["mute on surface", "--mute", "--surface", 4.5],
    ["on-primary on primary", "--on-primary", "--primary", 4.5],
    ["warning on surface", "--warning", "--surface", 4.5],
    ["danger on surface", "--danger", "--surface", 4.5],
    ["success on surface", "--success", "--surface", 4.5],
    ["control border on surface", "--control", "--surface", 3.0],
    ["focus ring on surface", "--focus", "--surface", 3.0],
    ["series 1 on surface", "--s0", "--surface", 3.0],
    ["series 2 on surface", "--s1", "--surface", 3.0],
    ["series 3 on surface", "--s2", "--surface", 3.0]
  ];
  let contrastFails = 0;
  const rows = pairs.map(([label, fg, bg, min]) => {
    const r = contrastRatio(t(fg), t(bg));
    const ok = r >= min;
    if (!ok) contrastFails++;
    return `<tr><td>${label}</td><td class="mono">${t(fg)} / ${t(bg)}</td><td class="num">${r.toFixed(2)}:1</td><td class="num">≥ ${min}:1</td><td class="${ok ? "pass-pill" : "fail-pill"}">${ok ? "PASS" : "FAIL"}</td></tr>`;
  }).join("");

  // Live LAB-01 scan over rendered shell text (terms assembled dynamically so raw source also stays free of forbidden tokens)
  const shellText = document.getElementById("shell").innerText;
  const bannedTerms = ["cavitation-" + "free", "ventilation-" + "safe", "valid" + "ated", "optim" + "ized", "be" + "st", "recom" + "mended", "cert" + "ified"];
  const forbidden = new RegExp("\\b(" + bannedTerms.join("|") + ")\\b", "gi");
  const labHits = shellText.match(forbidden) || [];

  // Live XS-03 check in Experiment setup
  const isExp = activeSubArea() === "experiment";
  const runBtnsInExp = isExp
    ? Array.from(document.querySelectorAll("#main-body button")).filter(b => /\brun\b/i.test(b.textContent)).length
    : 0;

  // Live ANA-19 / Labels.FixedVlm check: "deep water" must never appear when h_ref is unset OR h/c < 5.0
  const activeHRef = ui.state === "depth-unset" ? null : 0.50;
  const activeDeepWater = fixedVlmBasis(activeHRef).isDeepWater;
  const deepWaterLeak = !activeDeepWater && /deep water/i.test(shellText);

  document.getElementById("audit").innerHTML = `
    <h2>In-page review audit (Theme: ${ui.theme} · Viewport: ${ui.vp} · State: ${ui.state})</h2>
    <div class="audit-summary">
      <span class="${contrastFails === 0 ? "pass-pill" : "fail-pill"}">Contrast: ${pairs.length - contrastFails}/${pairs.length} PASS</span>
      <span class="${labHits.length === 0 ? "pass-pill" : "fail-pill"}">LAB-01 forbidden words in shell: ${labHits.length}</span>
      <span class="${runBtnsInExp === 0 ? "pass-pill" : "fail-pill"}">XS-03 Run buttons in Experiment setup: ${runBtnsInExp}</span>
      <span class="${!deepWaterLeak ? "pass-pill" : "fail-pill"}">ANA-19 / Labels.FixedVlm "deep water" leak (unset or h/c &lt; 5): ${deepWaterLeak ? "YES" : "0"}</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Token pair</th><th>Values</th><th class="num">Measured</th><th class="num">Floor</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// Keyboard shortcuts (keyboard-only persona parity)
document.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
  const area = activeSubArea();
  if (e.key === "ArrowDown" || e.key === "ArrowRight") {
    if (ui.state !== "empty" && ui.state !== "invalid") {
      ui.selectedCase = (ui.selectedCase + 1) % 12;
      renderAll();
    }
  } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
    if (ui.state !== "empty" && ui.state !== "invalid") {
      ui.selectedCase = (ui.selectedCase + 11) % 12;
      renderAll();
    }
  } else if ((e.key === "t" || e.key === "T") && area === "results") {
    ui.showTable = !ui.showTable;
    announce(ui.showTable ? "Table twin opened." : "Table twin hidden.");
    renderAll();
  } else if (e.key === "Escape" && ui.state === "running" && !ui.runCancelled) {
    ui.runCancelled = true;
    announce("Cancelled local sweep with Escape.");
    renderAll();
  }
});

function renderAll() {
  const cases = getCasesForState();
  renderHarness();
  renderSubTabs();
  renderPersonaBar();
  renderHeaderAndBanners(cases);
  renderLeftDock(cases);
  const area = activeSubArea();
  if (area === "experiment") renderExperimentView(cases);
  else if (area === "run") renderRunView(cases);
  else renderResultsView(cases);
  renderInspector(cases);
  renderStatusBar(cases);
  renderAudit();
}

renderAll();
</script>
