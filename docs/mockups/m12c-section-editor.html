<title>M1.2c section editor</title>
<!--
  Stop-and-show page for slice M1.2c (docs/design/m12c-section-editor.md). The operator, 2026-10-03: "I should be able to
  edit the sections". Three screens of the 1280 x 800 shell (today's: structure-B Properties, the V2 status strip,
  DR-VIEW-1 frames and DR-VIEW-7 plates), then the four decisions as side-by-side variants.
  Geometry is COMPUTED here from src/CfdWorkbench.Desktop/Assets/example.foil: section-a's two degree-5 surfaces, a
  PAIRED Control -> Anchor conversion (Ruling 60, ADR-0005 §6: Boehm insertion to multiplicity 5 and the ADR-0005 shift on
  the selected surface; the same knots inserted in the other surface, shape exact), a Horizontal tangent kind on both
  surfaces, a paired x move, a paired Anchor -> Control refit refused over 10 µm, per-side x inversion for thickness and
  crossing, Rule A for the placed section, and the FoilDSL §6 placement for the views. Every number printed on this page is read from that computation (window.__measure).
  Display only; nothing is built from this page.
-->
<style>
:root{ --font: system-ui, -apple-system, "Segoe UI", sans-serif; }
:root[data-theme="light"]{ --canvas:#f0f2f1; --surface:#fbfcfb; --soft:#e8edeb; --ink:#1b2929; --mute:#526362; --line:#c9d3cf; --control:#788d87; --accent:#006c67; --warn:#895900; --danger:#a92e37; --on-accent:#ffffff; }
:root[data-theme="dark"]{ --canvas:#172326; --surface:#1e2d31; --soft:#2a3d40; --ink:#ebf3f0; --mute:#b2c4bf; --line:#49605b; --control:#79928c; --accent:#88d8c6; --warn:#efc576; --danger:#ffaeb5; --on-accent:#10201f; }
:root{ --vp:#17272c; --vp-soft:#243a40; --vp-ink:#edf4f2; --vp-mute:#afc6c7; --vp-grid:#344b50; --foil:#85c9c4; --foil-edge:#c4e7df; --station:#66ddc8; --lit:#3f6a6c; --danger-vp:#ffaeb5; }
*{ box-sizing:border-box; }

/* structure-B Properties (DR-CELL-1) */
.sel{ flex:1; min-height:0; overflow:hidden; }

/* Points pane grid */

.msglist{ flex:1; overflow:hidden; } .msglist div{ padding:4px 8px; border-bottom:1px solid var(--line); } .msglist .t{ color:var(--mute); } .msglist a{ color:var(--accent); text-decoration:underline; }

.sb{ flex:0 0 24px; display:flex; align-items:stretch; background:var(--surface); border-top:1px solid var(--line); position:relative; }

.pop .hd{ padding:6px 10px; font-weight:600; border-bottom:1px solid var(--line); } .pop .it{ display:flex; gap:8px; align-items:center; padding:6px 10px; color:var(--warn); } .pop .it a{ margin-left:auto; color:var(--accent); text-decoration:underline; }

<body>
<header class="top">
  <h1>M1.2c — edit a section, in today's shell</h1>
  <p>Example foil · section-a · point 4 made an anchor on both surfaces (paired point types, Ruling 60) · computed, not hand-placed</p>
  <label for="state">State <select id="state"></select></label>
  <button type="button" id="theme" aria-pressed="false">Dark theme</button>
</header>
<main id="screens"></main>
<script>
'use strict';
const MEASURE = {};
// ================================================================ geometry (example.foil)
const RAD = 0.017453292519943295, HALF = 450, LEAD = 0, TRAIL = 120, CHORD = TRAIL - LEAD, TC = 0.12, P5 = 5;
const K3 = [0, 0, 0, 0, 0.25, 0.5, 0.75, 1, 1, 1, 1], K5 = [0, 0, 0, 0, 0, 0, 1 / 3, 2 / 3, 1, 1, 1, 1, 1, 1];
const TWIST = [[0, 0], [0.1, 0], [0.3, -0.25], [0.5, -0.5], [0.7, -1], [0.9, -1.5], [1, -2]];
const DIHEDRAL = [[0, 0], [0.1, 0], [0.3, 0], [0.5, 0], [0.7, 0], [0.9, 0], [1, 0]];           // the fixture's (flat)
const THICK = [[0, 12], [0.1, 12], [0.3, 12], [0.5, 12], [0.7, 12], [0.9, 12], [1, 12]];
const UPPER = [[0, 0], [0, 0.025], [0.15, 0.055], [0.35, 0.065], [0.55, 0.05], [0.75, 0.03], [0.9, 0.01], [1, 0]];
const LOWER = UPPER.map(([x, z]) => [x, -z]);
function deBoor(p, U, P, u){
  const n = P.length - 1; u = Math.min(Math.max(u, U[p]), U[n + 1]);
  let k = p; while (k < n && u >= U[k + 1]) k++;
  const d = []; for (let j = 0; j <= p; j++) d.push(P[k - p + j].slice());
  for (let r = 1; r <= p; r++) for (let j = p; j >= r; j--){
    const i = k - p + j, den = U[i + p - r + 1] - U[i], a = den ? (u - U[i]) / den : 0;
    d[j] = [(1 - a) * d[j - 1][0] + a * d[j][0], (1 - a) * d[j - 1][1] + a * d[j][1]]; }
  return d[p];
}
const crv = (U, P) => ({ U, P });
const at = (c, u) => deBoor(P5, c.U, c.P, u);
function insertOnce(c, u){                                    // Boehm (Piegl–Tiller A5.1, r = 1)
  let k = P5; while (k < c.P.length - 1 && u >= c.U[k + 1]) k++;
  const Q = []; for (let i = 0; i <= k - P5; i++) Q.push(c.P[i].slice());
  for (let i = k - P5 + 1; i <= k; i++){ const a = (u - c.U[i]) / (c.U[i + P5] - c.U[i]); Q.push([(1 - a) * c.P[i - 1][0] + a * c.P[i][0], (1 - a) * c.P[i - 1][1] + a * c.P[i][1]]); }
  for (let i = k; i < c.P.length; i++) Q.push(c.P[i].slice());
  return crv(c.U.slice(0, k + 1).concat([u], c.U.slice(k + 1)), Q);
}
function uOfX(c, x){ let a = 0, b = 1; for (let i = 0; i < 64; i++){ const m = (a + b) / 2; if (at(c, m)[0] < x) a = m; else b = m; } return (a + b) / 2; }
const yOfX = (c, x) => at(c, uOfX(c, x))[1];
// an interior vertex is an anchor iff one interior knot of multiplicity exactly p sits at it (ADR-0005; FoilSource.IsAnchor, p-general)
function isAnchor(c, i){ const U = c.U, n = c.P.length; if (i < 1 || i > n - 2) return false; const k = U[i + 1];
  for (let j = 2; j <= P5; j++) if (U[i + j] !== k) return false; return U[i] !== k && U[i + P5 + 1] !== k && k > 0 && k < 1; }
function roles(c){ const n = c.P.length, r = c.P.map((_, i) => 'control');
  r[0] = 'nose'; r[1] = 'nosehandle'; r[n - 1] = 'te'; r[n - 2] = 'tehandle';
  for (let i = 2; i < n - 2; i++) if (isAnchor(c, i)){ r[i] = 'anchor'; if (r[i - 1] === 'control') r[i - 1] = 'handle'; if (r[i + 1] === 'control') r[i + 1] = 'handle'; }
  return r; }
// Control -> Anchor on ONE surface (ADR-0005 decision 5, per surface under DR-11)
function makeAnchor(c, idx){
  const P = c.P[idx], u = uOfX(c, P[0]); let d = c;
  for (let r = 0; r < P5; r++) d = insertOnce(d, u);
  const on = at(d, u), ai = d.P.findIndex(q => Math.hypot(q[0] - on[0], q[1] - on[1]) < 1e-12), dy = P[1] - on[1];
  let boehm = 0; for (let i = 0; i <= 400; i++){ const a = at(c, i / 400), b = at(d, i / 400); boehm = Math.max(boehm, Math.hypot(a[0] - b[0], a[1] - b[1])); }
  return { c:crv(d.U, d.P.map((q, i) => i >= ai - 1 && i <= ai + 1 ? [q[0], q[1] + dy] : q.slice())), ai, dy, u, boehm };
}
const horizontal = (c, ai) => crv(c.U, c.P.map((q, i) => i === ai - 1 || i === ai + 1 ? [q[0], c.P[ai][1]] : q.slice()));
function maxChange(a, b){ let m = 0; for (let i = 1; i < 800; i++){ const x = i / 800; m = Math.max(m, Math.abs(yOfX(a, x) - yOfX(b, x))); } return m; }
function thickness(up, lo){ let t = 0, xt = 0; for (let i = 1; i < 800; i++){ const x = i / 800, d = yOfX(up, x) - yOfX(lo, x); if (d > t){ t = d; xt = x; } } return { t, x:xt }; }
function crossing(up, lo){ let a = null, b = null; for (let i = 1; i < 800; i++){ const x = i / 800; if (yOfX(up, x) <= yOfX(lo, x)){ if (a === null) a = x; b = x; } } return a === null ? null : [a, b]; }
const UP0 = crv(K5, UPPER), LO0 = crv(K5, LOWER);
const ANCH = makeAnchor(UP0, 3), UP1 = horizontal(ANCH.c, ANCH.ai);
const T0 = thickness(UP0, LO0);
const knotsHave = (c, k) => c.U.includes(k);
const handleLen = (c, ai, k) => Math.hypot(c.P[ai + k][0] - c.P[ai][0], c.P[ai + k][1] - c.P[ai][1]);
Object.assign(MEASURE, { anchorU: +ANCH.u.toFixed(6), upperPointsBefore: UP0.P.length, upperPointsAfter: UP1.P.length, lowerPoints: LO0.P.length,
  boehmShapeChange: ANCH.boehm, anchorShiftPctChord: +(ANCH.dy * 100).toFixed(3), largestChangePct: +(maxChange(UP0, ANCH.c) * 100).toFixed(2),
  horizontalLargestChangePct: +(maxChange(UP0, UP1) * 100).toFixed(2), ownThicknessBefore: [+(T0.t * 100).toFixed(2), +(T0.x * 100).toFixed(1)] });
// curvature from the analytic B-spline derivatives (derivative control points, Piegl–Tiller §3.3), never finite differences
function derivOf(U, P, p){ const Q = []; for (let i = 0; i < P.length - 1; i++){ const d = U[i + p + 1] - U[i + 1]; Q.push(d ? [p * (P[i + 1][0] - P[i][0]) / d, p * (P[i + 1][1] - P[i][1]) / d] : [0, 0]); } return { U:U.slice(1, -1), P:Q, p:p - 1 }; }
function kappa(c, u){ const d1 = derivOf(c.U, c.P, P5), d2 = derivOf(d1.U, d1.P, d1.p), a = deBoor(d1.p, d1.U, d1.P, u), b = deBoor(d2.p, d2.U, d2.P, u);
  return (a[0] * b[1] - a[1] * b[0]) / Math.pow(Math.hypot(a[0], a[1]), 3); }
const leRadius = c => 1 / Math.abs(kappa(c, 0));                                      // chord fractions
// the same readouts as BUILT at a station (Rule A, one profile): placed y = C ± tc·T/2. LE radius from y² ≈ 2 r x at the
// nose (vertical tangent), wedge from the placed slopes at x = 1 (Marine-CAD MC-12C-R1: own vs at-station)

function camera(azDeg, elDeg, R){

}
function draw3D(g, w, h, MESH){

  const top = 44, bot = 64, s = Math.min((w - 60) / (x1 - x0), (h - top - bot) / (y1 - y0)), ox = (w - (x1 - x0) * s) / 2 - x0 * s, oy = top + (h - top - bot - (y1 - y0) * s) / 2 - y0 * s;
  const S = p => { const q = cam.proj(p); return [ox + q[0] * s, oy + q[1] * s, q[2]]; };
  const zmin = Math.min(...MESH.flat().map(p => p[2])) - 10;
  for (let x = -100; x <= 220; x += 40) line(g, [S([x, -560, zmin]), S([x, 560, zmin])], C.grid, 1);
  for (let y = -560; y <= 560; y += 80) line(g, [S([-100, y, zmin]), S([220, y, zmin])], C.grid, 1);
  const V = MESH.map(r => r.map(S)), items = [], facing = [], shade = [];

    for (let j = 0; j < NR; j++){ const a = MESH[i][j], b = MESH[i + 1][j], d = MESH[i][(j + 1) % NR];
      const n = cam.nrm(cam.cross([b[0] - a[0], b[1] - a[1], b[2] - a[2]], [d[0] - a[0], d[1] - a[1], d[2] - a[2]])), v = cam.nrm(cam.eye.map((e, k) => e - a[k])), dv = cam.dot(n, v);
      facing[i].push(dv > 0); shade[i].push(Math.min(1, Math.abs(dv))); } }

  for (let i = 0; i < 2 * M; i++) for (let j = 0; j < NR; j++){
    const q = [V[i][j], V[i + 1][j], V[i + 1][(j + 1) % NR], V[i][(j + 1) % NR]], col = mix(C.soft, C.lit, shade[i][j]);
    items.push({ z:(q[0][2] + q[1][2] + q[2][2] + q[3][2]) / 4, f(){ g.beginPath(); q.forEach((p, k) => k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fillStyle = col; g.fill(); g.strokeStyle = col; g.lineWidth = .6; g.stroke(); } }); }

    if (i > 0 && facing[i][j] !== facing[i - 1][j]) seg(V[i][j], V[i][(j + 1) % NR], C.foil, 1.5); }
  for (let j = 0; j < NR; j++){ seg(V[M][j], V[M][(j + 1) % NR], C.station, 3); seg(V[0][j], V[0][(j + 1) % NR], C.foil, 1.5); seg(V[2 * M][j], V[2 * M][(j + 1) % NR], C.edge, 1); }

}

}

  secFullB:(g, w, h) => { const o = drawSection(g, w, h, { up:UP1, lo:LO1, sel:SEL_A, partner:PAIR(SEL_A), comb:true }); MEASURE.odB = +o.pxPerPct.toFixed(2); MEASURE.fullChordNeighbourPxB = +gapAround(o.pts, 'upper', ANCH.ai).toFixed(1); },

// the Tracing probe at the pointer (Sections.Probe): record values, local thickness, and what the station builds there
function probeText(up, lo, x){ const u = yOfX(up, x), l = yOfX(lo, x), own = thickness(up, lo).t, placedMm = (u - l) / own * TC * CHORD;
  return `Display · pointer x ${pc(x)} % · upper ${pc(u)} % · lower ${pc(l)} % · t here ${pc(u - l)} % · at Root ${placedMm.toFixed(2)} mm (12.00 % t/c)`; }
const PLATES = { secFit:probeText(UP1, LO1, 0.42), secCross:probeText(UP1, LO2, 0.8) + ' · crossing ' + CROSS.map(v => Math.round(v * 100)).join('–') + ' %' };
function od4HTML(){ return `<div class="textcard" style="height:auto;width:1296px"><p><b>a · Ship with paired point types</b> <span class="rec" style="display:inline-block;padding:0 6px;border-radius:3px;background:var(--accent);color:var(--on-accent);font-weight:600">Chosen · operator 2026-10-03</span> — an anchor on one surface also inserts the same knots in the other surface (shape exact; that surface gains points of its own type). This certifies today (ADR-0005 §6). Everything else in M1.2c (the editor, the draft, Finish/Cancel, moves, constructions, the Points pane) does not depend on the certificate. DR-11 comes back to you with the measured numbers.</p>
  <p style="margin-top:8px;color:var(--mute)"><b>b · Hold M1.2c</b> until the certificate lands. (Not chosen · kept as the record.)</p>
  <p style="margin-top:8px;color:var(--mute)">The certificate spike measured a no-go (docs/proof/m12c-certificate-spike/verdict.md), so a ships (Ruling 60). This page now draws paired types: the lower surface has ${LO1.P.length} points too, with an anchor at the same chord position (screens 2, 2b, 2c). Go criteria for the spike: five fixtures certify (an upper-only anchor, NACA 0012 with 12/10 points, a thin open-TE section, a drooped cambered nose, and the two M1.1 x-edit blends, run at 120 mm and at 2 m chord) within 1 s, 4,096 cells and 32,768-bit rationals, with the existing whole-domain placement proofs still inside 10 nm for every blend weight.</p></div>`; }
function cardHTML(c){ if (c.text) return `<div class="card"><div class="textcard"><p style="margin-top:0;color:var(--ink)">With "Keep the station's t/c", raising record upper point 4 by <b>${MEASURE.od1c.recordMoveMm.toFixed(2)} mm</b> moves the placed upper surface <b>${MEASURE.od1c.placedUpperAt35Mm.toFixed(2)} mm</b> at 35 % chord — and the placed <b>lower</b> surface <b>${MEASURE.od1c.placedLowerAt35Mm.toFixed(2)} mm</b> the same way, because the station's t/c is held and the section renormalizes. A drag on the placed section would leave the pointer ~${Math.round(MEASURE.od1c.recordMoveMm / MEASURE.od1c.placedUpperAt35Mm)}× away from the surface and pull the other surface along. With per-surface points it is worse: a placed surface mixes both record surfaces at equal x.</p><canvas data-k="delta"></canvas></div><h3>${c.h}</h3><p>${c.p}</p></div>`;
  return `<div class="card"><div class="frame">${shell(c.o)}</div><h3>${c.h}${c.rec ? '<span class="rec">Chosen · operator 2026-10-03</span>' : '<span class="rec lost">Not chosen · kept as the record</span>'}</h3><p>${c.p}${c.meas ? ` <b data-m="${c.meas}"></b>` : ''}</p></div>`; }
document.getElementById('screens').innerHTML =
  SCREENS.map(sc => `<section class="screen" id="${sc.id}"><h2>${sc.h}</h2><p class="what">${sc.what}</p>${shell(sc.o)}</section>`).join('') +
  `<h2 style="font-size:15px;margin:8px 0 0">The decisions — ruled by the operator on 2026-10-03 (docs/notes/m12c-rulings.md)</h2>` +
  DECISIONS.map(d => `<section class="decision" id="${d.id}"><h2>${d.h}</h2><p class="what">${d.what}</p>${d.text ? od4HTML() : `<div class="variants">${d.cards.map(cardHTML).join('')}</div>`}</section>`).join('') +
  `<p class="measured" id="measured"></p>`;
function paint(){
  document.querySelectorAll('canvas[data-k]').forEach(cv => {
    const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return; const dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = C.vp; g.fillRect(0, 0, w, h);
    const out = DRAW[cv.dataset.k](g, w, h), view = cv.parentElement;
    if (!view.classList.contains('view')) return;
    view.querySelectorAll('.plate:not(.vlabel)').forEach(n => n.remove());
    const add = (cls, text, style) => { const p = document.createElement('div'); p.className = 'plate ' + cls; p.textContent = text; if (style) p.setAttribute('style', style); view.appendChild(p); };
    if (PLATES[cv.dataset.k]) add('probe', PLATES[cv.dataset.k], cv.dataset.k === 'secCross' ? 'top:48px' : '');
    if (out && out.combClipped !== undefined){ add('lb', `Comb · auto scale · ${out.combClipped} teeth clipped (×)`); MEASURE['combClipped_' + cv.dataset.k] = out.combClipped; }
    if (out && out.probe && w > 300) add('probe', out.probe); if (out && out.lanecap) add('lb', out.lanecap, `top:${out.laneTop}px;bottom:auto`);
  });
  // rows of the Points pane fully visible without scrolling, read from the rendered cards (A: bottom panel, B: right side bar)
  const rowsIn = sel => { const el = document.querySelector(sel); if (!el) return null; const box = el.getBoundingClientRect(), rows = [...el.querySelectorAll('.pr')];
    return [rows.filter(r => r.getBoundingClientRect().bottom <= box.bottom + 0.5).length, rows.length]; };
  MEASURE.rowsA = rowsIn('section.decision .bottom .pts'); MEASURE.rowsB = rowsIn('section.screen .dock.right .pts'); MEASURE.rowsD = rowsIn('section.decision .work > .dock:first-child .pts');
  document.querySelectorAll('[data-m]').forEach(b => { const m = b.dataset.m, rows = m === 'odA' ? MEASURE.rowsA : m === 'odB' ? MEASURE.rowsB : m === 'odD' ? MEASURE.rowsD : null;
    b.textContent = `${MEASURE[m]} px per % chord; ${rows ? `${rows[0]} of ${rows[1]} point rows visible without scrolling.` : 'no Points pane.'}`; });
  document.getElementById('measured').innerHTML = `Measured on this page: Fit Selection puts the anchor's nearest neighbour <code>${MEASURE.fitSelectionNeighbourPx} px</code> away; at full chord in layout B it is <code>${MEASURE.fullChordNeighbourPxB} px</code> (glyphs overlap — the reason Fit Selection frames an anchor with its handles, design §11.2). Canvas scale at full chord (1:1): A <code>${MEASURE.odA}</code>, B <code>${MEASURE.odB}</code>, C <code>${MEASURE.odC}</code>, D <code>${MEASURE.odD}</code> px per % chord. LE radius upper · lower <code>${MEASURE.leRadiusUpperPct} · ${MEASURE.leRadiusLowerPct} % c</code>; TE wedge <code>${MEASURE.teWedgeDeg}°</code>; Anchor → Control on the new anchor changes the surface by <code>${MEASURE.anchorToControlChangePct} % chord</code> (${MEASURE.anchorToControlPoints} points). Paired: knots equal <code>${MEASURE.pairedKnotsEqual}</code>, abscissae equal <code>${MEASURE.pairedAbscissaeEqual}</code>, lower shape change from the knots <code>${MEASURE.pairedLowerBoehmChange.toExponential(1)}</code>, lower change from Horizontal <code>${MEASURE.pairedLowerHorizontalChangePct} % chord</code>; refused refit <code>${MEASURE.refitLowerDevMm} mm</code> against <code>${MEASURE.refitLimitMm} mm</code>. All values: <code>window.__measure</code>.`;
  window.__measure = MEASURE;
}
