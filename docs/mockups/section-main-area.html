  for (let y = -0.6; y <= 0.601; y += 0.1) line(g, [P(y, -0.3), P(y, 0.5)], C.grid, 1);
  for (let x = -0.3; x <= 0.501; x += 0.1) line(g, [P(-0.6, x), P(0.6, x)], C.grid, 1);
  g.beginPath(); [P(-HALF, 0), P(HALF, 0), P(HALF, CHORD), P(-HALF, CHORD)].forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fillStyle = 'rgba(133,201,196,0.28)'; g.fill(); g.strokeStyle = C.foil; g.lineWidth = 1.5; g.stroke();
  line(g, [P(0, 0), P(0, CHORD)], C.edge, 1.5);
}
const planView = (o) => `<div class="view" data-v="${o.v}"><canvas role="img" aria-label="${o.alt}"></canvas><span class="plate vlabel">${o.label}</span>
  <div class="chipstrip" aria-label="Station sections">${STATIONS.map(st => `<button type="button" class="pchip${o.sel === st.n ? ' on' : ''}" data-eta="${st.eta}" aria-pressed="${o.sel === st.n}" aria-label="${st.name}, station η ${st.eta}${o.sel === st.n ? ', selected' : ''}">${st.name}</button>`).join('')}</div>
  <div class="plate vcap2">50 mm · Plan · top</div>${o.extra || ''}</div>`;
const isoView = (extra) => `<div class="view" data-v="iso"><canvas role="img" aria-label="3D iso view of the wing on its grid"></canvas><span class="plate vlabel">3D · Iso</span>${extra || ''}<div class="plate vtop">Display · x aft, y starboard, z up · twist about the leading edge</div></div>`;

const sw = (c, dash, m) => `<svg width="34" height="12" aria-hidden="true" focusable="false"><line x1="1" y1="6" x2="33" y2="6" stroke="${c}" stroke-width="2"${dash ? ' stroke-dasharray="5 4"' : ''}/>${m === 'o' ? `<circle cx="17" cy="6" r="3" fill="${c}"/>` : `<rect x="14" y="3" width="6" height="6" fill="${c}"/>`}</svg>`;
const NAMES = { cp:'Cp', polar:'Polar', trans:'Transition', bucket:'Bucket' };
const segOf = on => `<div class="seg" role="group" aria-label="Section chart">${Object.keys(NAMES).map(c => `<button type="button" data-chart="${c}" aria-pressed="${c === on}">${NAMES[c]}</button>`).join('')}</div>`;
function notesOf(on){ const acc = 'var(--accent)', ink = 'var(--ink)';
  return { cp:`<div class="note">Upper: solid, round markers. Lower: dashed, square markers. Suction plots up; axis Cp. Cp_min ${f(SGOV.cpmin, 2)} at x/c ${f(SGOV.xCp, 3)} (${SGOV.side}); α_eff ${f(AEG, 2)}°.</div><div class="note lab">${COPY.c214} · ${COPY.estLabel(true)}</div>`,
    polar:`<div class="note">${sw(acc, false, 'o')} Ncrit 4 · ${sw(ink, true, 's')} Ncrit 2 · shaded: the band. Outside ±6°: no data drawn. Re ${fe(ReStrip)} · clean.</div><div class="note lab">${COPY.c215} · ${COPY.c66}</div><div class="note">${COPY.surrogate}</div>`,
    trans:`<div class="note">${sw(acc, false, 'o')} upper N4 · ${sw(acc, true, 'o')} upper N2 · ${sw(ink, false, 's')} lower N4 · ${sw(ink, true, 's')} lower N2</div><div class="note lab">Re ${fe(ReStrip)} · Ncrit 2 and 4 · clean · α −6° to 6° · ${COPY.c215}</div>`,
    bucket:`<div class="note">σ required = −Cp_min (inviscid; sheet) against Cl; dashed: operating σ; dotted: −Cp_min × 1.15, the margin edge. ${COPY.c214}</div><div class="note lab">${COPY48}</div>` }[on]; }
const CAPS = { cp:'Cp against x over c, upper and lower surface, suction plotted up, with the Cp_min marker', polar:'cl against alpha and cd against cl for Ncrit 4 and 2, with the validated bracket', trans:'Transition location x_tr over c against alpha, upper and lower, Ncrit 4 and 2', bucket:'Required sigma against Cl and critical speed against Cl with the operating line' };

function stationsTable(){
  const etas = [GOVETA, 0.25, 0.5, 0.75, 1], cur = ETA_SEL == null ? GOVETA : ETA_SEL;
  const rows = etas.map(e => { const x = nearest(e), eta = x.s.y / HALF, c = cav(x.sec.cpmin, V, HREF, PV), on = Math.abs(eta - cur) < 0.02;
    return `<tr${on ? ' class="on" aria-current="true"' : ''}><td>η ${etaTxt(eta)}</td><td>${f(x.s.aEff, 2)}</td><td>${f(-x.sec.cpmin, 3)}</td><td>${c.state === 'clear' ? 'Clear' : c.state === 'inside' ? 'Inside the margin' : 'Possible'}</td></tr>`; }).join('');
  return grp('Stations', `${etas.length} of ${HALFSTR.length}`, `<table class="st" aria-label="Stations"><tr><th>Station</th><th>α_eff °</th><th>−Cp_min</th><th>Cavitation</th></tr>${rows}</table>`);
}
function docSection(st){
  const x = ETA_SEL == null ? GOV : nearest(ETA_SEL); setStation(x);
  const c = ETA_SEL == null ? CAV10 : cav(SGOV.cpmin, V, HREF, PV), cs = CHARTS[st.chart]();
  const cpR = cpRange(SGOV);
  const left = `<div class="dl"><div class="dh"><b class="st-name">${stationName()}</b>${segOf(st.chart)}<button type="button" class="twin">Show table</button></div>
    <div class="view prof" data-v="sec"><canvas role="img" aria-label="Section profile at the station, pressure coefficient drawn on the profile"></canvas><span class="plate vlabel">Section · η ${etaTxt(x.s.y / HALF)}</span><div class="plate vtop">${COPY.c214} · inviscid; no boundary layer</div>
      <div class="plate vcap">${capCav(c)}</div><div class="plate legend">Cp · vik pinned at 0 · ${f(-cpR, 2)} to ${f(cpR, 2)}<span class="ramp" style="background:${VIKRAMP}"></span><span class="ends"><span>${f(-cpR, 2)}</span><span>0</span><span>${f(cpR, 2)}</span></span></div></div>
    <div class="charts">${cs.map((k, i) => `<canvas class="cv" data-i="${i}" role="img" aria-label="${CAPS[st.chart]}${cs.length > 1 ? ', panel ' + (i + 1) + ' of ' + cs.length : ''}; table available"></canvas>`).join('')}</div>${notesOf(st.chart)}</div>`;
  const right = `<div class="dr">${stationsTable()}${polarGroup()}${cavGroup(c)}</div>`;
  return `<div class="doc" role="tabpanel" aria-label="Section">${left}${right}</div>`;
}
const capCav = c => `σ ${f(c.sigma, 2)} · −Cp_min ${f(c.sup, 2)} · ${c.state === 'clear' ? 'clear of' : c.state === 'inside' ? 'inside' : 'at or past'} the 15 % margin · V_crit ${f(c.vcrit / KN, 1)} kn`;
const VIKRAMP = `linear-gradient(90deg, ${VIK.join(',')})`;

function compactBottom(){
  const x = ETA_SEL == null ? GOV : nearest(ETA_SEL), tabs = ['Spanwise loading', 'Section', 'Loads', 'Provenance', 'Checks'];
  return `<div class="bottom compact"><div class="tabs">${tabs.map(t => `<span class="${t === 'Section' ? 'on' : ''}">${t}</span>`).join('')}</div>
    <div class="sumline" role="group" aria-label="Section summary"><b>${stationName()}</b><span>cl (panel) <b>${f(x.sec.cl, 3)}</b></span><span>−Cp_min <b>${f(-x.sec.cpmin, 3)}</b></span><button type="button" class="open" data-open>${PC('Open in main area')}</button></div></div>`;
}
function dock(k){
  const head = `<div class="tabs"><span class="on">Properties</span><span>Browser</span><span>Rail controls</span></div>`;
  const wing = `<div class="grp"><div class="gh"><span class="tw">⌄</span>Wing</div>${r('Span', '900.00', 'mm')}${r('Root chord', '120.00', 'mm')}${r('Tip chord', '120.00', 'mm')}</div>`;
  const stn = `<div class="ident2"><b>Tip station</b><span>Station 2 of 2</span></div>${grp('Station', '', r('From root', '450.00', 'mm') + r('η', '1.000', '') + r('Chord', '120.00', 'mm') + r('t/c', '12.00', '%') + r('Section', 'NACA 0012', ''))}`;
  if (k === 'A') return `<div class="dock">${head}<div class="sel">${stn}</div>${wing}</div>`;
  if (k === 'B'){ const t = nearest(ETA_SEL).s;
    return `<div class="dock">${head}<div class="sel">${stn}<div class="ident">Strip of wing run (α_eff) · η ${etaTxt(ETA_SEL)}</div>${chipOf(COPY.c213)}${stripGroup(t, true)}${verdictGroup(t, true)}</div></div>`; }
  return `<div class="dock">${head}<div class="sel"><div class="ident">Basic foil · wing result</div>${chipOf(COPY.c213)}${grp('Wing result', 'Wing only · S_ref ' + f(R.S * 1e4, 0) + ' cm²', r('CL', f(R.CL, 3), '–') + `<div class="note lab">${envRowOf(R)}</div>` + r('CDi (Trefftz)', f(R.CDi, 5), '–') + r('Lift L', f(R.L, 1), 'N') + r('Induced drag', f(R.Di, 2), 'N') + na('Total drag', COPY.totalMissing))}</div></div>`;
}
const mtabs = on => `<div class="mtabs" role="tablist" aria-label="Model area">${['Plan', 'Section', 'Foil source'].map(t => `<span role="tab" aria-selected="${t === on}" class="${t === on ? 'on' : ''}">${t === 'Section' ? PC('Section') : t}</span>`).join('')}</div>`;
const navbar = (mode, views) => `<div class="navbar"><div class="seg" role="group" aria-label="Area"><button type="button" aria-pressed="${mode === 'CAD'}">CAD</button><button type="button" aria-pressed="${mode === 'Analysis'}">Analysis</button></div><span class="sep"></span>${views ? `<button type="button">Views ▾ Plan + 3D</button><button type="button">Display ▾ Shaded</button><span class="sep"></span>` : ''}<button type="button">Fit</button>${views ? '<button type="button">Fit Selection</button>' : ''}</div>`;

const STATES = {
  A:{ h:'A · CAD, Plan tab — station chips in a margin strip under the planform', what:`Each station's section name sits in a strip <b>below</b> the planform, on the station's own line, never over the geometry. The tip chip is selected here (line heavier, chip outlined); the Properties dock shows the Tip station. <b>Click</b> a chip selects its station; <b>double-click</b> opens the section editor (as today). The Section sample tab is gone; the tabs are Plan · Section · Foil source.` },
  B:{ h:'B · Analysis, Section tab — a selected strip', what:`The Section document tab at full size: the header names the station (COPY-394), the chart selector (Cp · Polar · Transition · Bucket), the section profile with Cp, the chart, the short Stations table, then the polar and cavitation groups. The bottom panel Section tab is now one line with its action.` },
  C:{ h:'C · Analysis, Section tab — no strip selected, governing fallback', what:`Same document with no strip selected: the header reads COPY-395, and the profile, chart and groups show the governing cavitation station (Ruling 86).` },
  D:{ h:'D · Analysis, Plan tab — compact Section summary in the bottom panel', what:`The bottom-panel Section tab keeps one line: station name, cl (panel), −Cp_min and the action <b>Open in main area</b> (proposed copy). The panel is shorter, so the Plan gets the room. Chips are in the margin strip here too.` }
};
function frame(k, st){
  const mid = k === 'A' || k === 'D' ? 'Plan' : 'Section';
  let area = '', bottom = '', condb = k === 'A' ? '' : condBand({}), sbmsg;
  if (k === 'A'){
    area = `<div class="views half">${planView({ v:'plan', label:'Plan', sel:2, alt:'Plan view of the planform with the station lines and the chip strip below it' })}${isoView('<div class="plate tip">Tip</div>')}</div>${navbar('CAD', true)}`; sbmsg = 'Tip station selected'; }
  else if (k === 'D'){
    area = `<div class="views half">${planView({ v:'plan', label:'Plan', sel:0, alt:'Plan view with spanwise loading strips, the governing station and the chip strip below the planform', extra:`<div class="plate legend">Γ per strip · batlow · 0 – ${f(loadMax, 3)} m²/s · run k-7c1e…<span class="ramp" style="background:linear-gradient(90deg,${BATLOW.join(',')})"></span><span class="ends"><span>0</span><span>${f(loadMax, 3)}</span></span></div>` })}${isoView()}</div>${navbar('Analysis', true)}`;
    bottom = compactBottom(); sbmsg = `Analysis. Cavitation screen governed by η ${etaTxt(GOVETA)} at depth ${f(HREF, 2)} m.`; }
  else { area = `${docSection(st)}${navbar('Analysis', false)}`; bottom = compactBottom(); sbmsg = k === 'B' ? `Analysis. Section tab at η ${etaTxt(ETA_SEL)}.` : `Analysis. Section tab at the governing station, η ${etaTxt(GOVETA)}.`; }
  return `<div class="shell"><div class="title"><i></i><i></i><i></i><b>CFD Workbench — example.foil</b></div>
    <div class="work">${dock(k)}<div class="main">${mtabs(mid)}${condb}<div class="area">${area}</div>${bottom}</div></div>
    <div class="sb" role="status"><span class="msg">${sbmsg}</span>${k === 'A' ? '<span class="item">mm</span><span class="item">≈ estimates</span><span class="item">Text 100 %</span>' : `<span class="item">Analysis: Current</span><span class="item">${stationName()}</span>`}</div></div>`;
}
const PROPOSED = [['Open in main area', 'the bottom-panel action (named in Ruling 124, not a DESIGN.md row)'], ['Section', 'the document tab title (the word is the bottom-panel tab name; no DESIGN.md row for the model-area tab)']];
let CUR = 'A', CHART = 'cp';
function render(){
  ETA_SEL = CUR === 'B' ? 1 : null;
  const st = { chart:CHART };
  document.getElementById('screens').innerHTML = `<nav class="statetabs" role="tablist" aria-label="State">${Object.keys(STATES).map(k => `<button type="button" role="tab" data-state="${k}" aria-selected="${k === CUR}">${STATES[k].h.split(' — ')[0]}</button>`).join('')}</nav>
    <section class="screen"><h2>${STATES[CUR].h}</h2><p class="what">${STATES[CUR].what}</p>${frame(CUR, st)}</section>
    <section class="sheet"><h3>Proposed copy (not in DESIGN.md COPY-293..399; needs operator approval)</h3><table><tr><th>String</th><th>Where</th></tr>${PROPOSED.map(p => `<tr><td>${PC(p[0])}</td><td>${p[1]}</td></tr>`).join('')}</table>
    <p class="what">Reused as approved: COPY-394 and COPY-395 (station name), COPY-295 (cl (panel)), the Cp, polar and cavitation groups and chart notes of the approved A3b and A3c states.</p></section>`;
  paint();
}
function paint(){
  const sec = document.querySelector('section.screen'); if (!sec) return;
  sec.querySelectorAll('.view').forEach(view => {
    const cv = view.querySelector('canvas'), w = view.clientWidth, h = view.clientHeight, dpr = devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = C.vp; g.fillRect(0, 0, w, h);
    const v = view.dataset.v;
    if (v === 'plan'){ drawPlan2(g, w, h, { load:CUR === 'D', sel:CUR === 'A' ? 2 : 0, gov:CUR === 'D' }); const q = planGeom(w, h);
      view.querySelectorAll('.pchip').forEach(b => { const eta = +b.dataset.eta; b.style.left = (q.cx + eta * HALF * q.s - b.offsetWidth / 2) + 'px'; b.style.top = (q.stripTop + 20) + 'px'; }); }
    else if (v === 'iso') drawIso(g, w, h);
    else drawSection(g, w, h, { sec:SGOV, xtr:null });
  });
  if (CUR === 'B' || CUR === 'C'){ const cs = CHARTS[CHART](); sec.querySelectorAll('canvas.cv').forEach(cv => chart(cv, cs[+cv.dataset.i].s)); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-state]'); if (t){ CUR = t.dataset.state; render(); return; }
  const c = e.target.closest('.seg button[data-chart]'); if (c){ CHART = c.dataset.chart; render(); const el = document.querySelector(`.seg button[data-chart="${CHART}"]`); if (el) el.focus(); return; }
  if (e.target.closest('[data-open]')){ CUR = ETA_SEL == null ? 'C' : 'B'; render(); }
});
document.getElementById('theme').addEventListener('click', e => { const b = e.currentTarget, d = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', d); b.textContent = d ? 'Light theme' : 'Dark theme'; document.documentElement.dataset.theme = d ? 'dark' : 'light'; render(); });
const q0 = new URLSearchParams(location.search); if (q0.get('s')) CUR = q0.get('s'); if (q0.get('c')) CHART = q0.get('c'); if (q0.get('t') === 'dark'){ document.documentElement.dataset.theme = 'dark'; }
render();
</script>
</body>
