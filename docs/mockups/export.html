<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export Dialog</title>
<!--
  Stop-and-show page for the first Export slice (Ruling 193; EXP-02, EXP-03): the section .dat, the wing STL and the 3MF.
  Display only; nothing is built from it until the operator approves. Every product sentence comes from COPY (the JSON
  block): COPY-EXnn rows are proposed in docs/design/export.md section 8, the rows marked spec are quoted from the
  specification. Every number comes from the probe receipts in docs/proof/exd/ (the FOILS table below is those outputs);
  the summary, the file name, the size and the findings are computed from that table and the chosen options at render time.
  The macOS save panel is a labelled stand-in: macOS draws it, CFD Workbench controls its title and suggested name.
-->
<style>
:root{ --font: system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
:root[data-theme="light"]{ --canvas:#f0f2f1; --surface:#fbfcfb; --soft:#e8edeb; --ink:#1b2929; --mute:#526362; --line:#c9d3cf; --control:#788d87; --accent:#006c67; --warn:#895900; --danger:#a92e37; --on-accent:#ffffff; }
:root[data-theme="dark"]{ --canvas:#172326; --surface:#1e2d31; --soft:#2a3d40; --ink:#ebf3f0; --mute:#b2c4bf; --line:#49605b; --control:#79928c; --accent:#88d8c6; --warn:#efc576; --danger:#ffaeb5; --on-accent:#10201f; }
:root{ --vp:#17272c; --vp-soft:#243a40; --vp-ink:#edf4f2; --vp-mute:#afc6c7; --foil:#85c9c4; --foil-edge:#c4e7df; }
*{ box-sizing:border-box; }
html, body{ margin:0; background:var(--canvas); color:var(--ink); font:13px/1.45 var(--font); }
button, select, input{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.top{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:10px 20px; border-bottom:1px solid var(--line); }
.top h1{ margin:0; font-size:15px; }
.top p{ margin:0; color:var(--mute); font-size:12px; flex-basis:100%; max-width:1280px; }
.top .ctl{ display:flex; align-items:center; gap:6px; color:var(--mute); font-size:12px; }
.top select{ min-height:28px; padding:0 6px; border:1px solid var(--control); border-radius:4px; background:var(--surface); color:var(--ink); }
.top select:disabled{ color:var(--mute); background:var(--soft); }
.top .chk{ min-height:28px; padding:0 10px; border:1px solid var(--control); border-radius:4px; background:var(--surface); display:inline-flex; align-items:center; gap:6px; }
.top .chk input{ width:16px; height:16px; margin:0; }
main{ padding:16px 20px 40px; min-width:1320px; }

/* the shell: today's window, reduced to what this flow touches */
.shell{ width:1280px; height:800px; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--canvas); position:relative; font-size:13px; line-height:18px; padding:8px; }
.chrome{ flex:1; min-height:0; display:flex; flex-direction:column; }
.title{ flex:0 0 28px; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--surface); border-bottom:1px solid var(--line); color:var(--mute); font-size:12px; }
.title b{ color:var(--ink); font-weight:600; }
.menubar{ flex:0 0 32px; display:flex; align-items:center; gap:2px; padding:0 8px; background:var(--surface); border-bottom:1px solid var(--line); position:relative; z-index:3; }
.menubar button{ min-height:26px; padding:0 10px; border:1px solid transparent; border-radius:4px; background:transparent; }
.menubar button[aria-expanded="true"]{ background:var(--soft); border-color:var(--line); }
.menu{ position:absolute; top:31px; min-width:300px; background:var(--surface); border:1px solid var(--control); border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.28); padding:4px; display:flex; flex-direction:column; z-index:4; }
.menu .mi{ display:flex; justify-content:space-between; gap:24px; min-height:28px; align-items:center; padding:0 10px; border:1px solid transparent; border-radius:4px; background:transparent; text-align:left; width:100%; }
.menu .mi .key{ color:var(--mute); font-size:12px; }
.menu .mi:disabled{ color:var(--mute); }
.menu .mi.new{ border-color:var(--accent); }
.menu hr{ border:0; border-top:1px solid var(--line); margin:4px 0; width:100%; }
.menu .why{ padding:2px 10px 6px; color:var(--mute); font-size:12px; }
.area{ flex:1; min-height:0; background:var(--vp); position:relative; }
.area svg{ position:absolute; inset:0; width:100%; height:100%; }
.area .cap{ position:absolute; left:8px; top:8px; padding:2px 8px; border-radius:3px; background:var(--vp-soft); color:var(--vp-ink); font-size:12px; }
.sb{ flex:0 0 32px; padding:4px 8px; display:flex; align-items:stretch; background:var(--surface); border-top:1px solid var(--line); }
.sb .msg{ flex:1; min-width:0; display:flex; align-items:center; gap:12px; padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; }
.sb .msg button{ min-height:20px; padding:0 8px; border:1px solid var(--control); border-radius:3px; background:var(--surface); font-size:12px; }
.sb .item{ display:flex; align-items:center; padding:0 8px; border-left:1px solid var(--line); color:var(--mute); font-size:12px; }
.layer{ position:absolute; inset:0; pointer-events:none; z-index:6; }
.layer > *{ pointer-events:auto; }
.scrim{ position:absolute; inset:0; background:var(--vp); opacity:.45; pointer-events:auto; }

/* the export dialog (SaveSectionDialog / CatalogDialog idiom, wider) */
.dlg{ position:absolute; left:50%; top:12px; width:800px; max-height:776px; transform:translateX(-50%); background:var(--surface); border:1px solid var(--control); border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.28); display:flex; flex-direction:column; gap:8px; padding:12px 16px; }
.dlg .dh{ font-weight:600; font-size:14px; margin:0; }
.dlg p{ margin:0; }
.cols{ display:grid; grid-template-columns:200px minmax(0,1fr); gap:16px; }
.fmts{ display:flex; flex-direction:column; gap:4px; }
.fmt{ min-height:32px; display:flex; align-items:center; padding:0 10px; border:1px solid var(--line); border-radius:4px; background:var(--surface); text-align:left; width:100%; }
.fmt[aria-checked="true"]{ border-color:var(--accent); background:var(--soft); font-weight:600; }
.fmt:disabled{ color:var(--mute); }
.fmts .why{ color:var(--mute); font-size:12px; padding:2px 4px; }
.opts{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 20px; min-width:0; align-content:start; }
.opts .wide{ grid-column:1 / -1; }
.grp{ border:0; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; min-width:0; }
.grp legend{ padding:0; font-weight:600; margin-bottom:2px; }
.grp .row{ display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center; }
.grp label{ display:inline-flex; align-items:center; gap:6px; min-height:28px; }
.grp input[type=radio]{ width:16px; height:16px; margin:0; accent-color:var(--accent); }
.grp select{ min-height:28px; padding:0 6px; border:1px solid var(--control); border-radius:4px; background:var(--surface); }
.help{ color:var(--mute); font-size:12px; max-width:500px; }
.locked{ display:flex; gap:8px; align-items:center; min-height:28px; }
.locked .v{ padding:2px 8px; border:1px solid var(--line); border-radius:3px; background:var(--soft); color:var(--mute); }
.sum{ border:1px solid var(--line); border-radius:4px; background:var(--canvas); padding:8px 10px; display:flex; flex-direction:column; gap:4px; }
.sum h3{ margin:0; font-size:13px; }
.sum dl{ display:grid; grid-template-columns:150px minmax(0,1fr); gap:2px 12px; margin:0; }
.sum dt{ color:var(--mute); }
.sum dd{ margin:0; font-variant-numeric:tabular-nums; }
.sum .skel dd, .sum .skel dt{ background:var(--soft); color:transparent; border-radius:3px; user-select:none; }
.sum .lim{ color:var(--mute); font-size:12px; }
.sum pre{ margin:4px 0 0; padding:6px 8px; border:1px solid var(--line); border-radius:3px; background:var(--surface); font:12px/1.4 var(--mono); overflow:hidden; }
.find{ padding:6px 8px; border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:3px; display:flex; gap:12px; align-items:center; justify-content:space-between; }
.find.err{ border-left-color:var(--danger); }
.find button{ min-height:24px; padding:0 8px; border:1px solid var(--control); border-radius:3px; background:var(--surface); flex:none; }
.safety{ color:var(--mute); font-size:12px; }
.dbtns{ display:flex; gap:6px; align-items:center; justify-content:flex-end; flex-wrap:wrap; margin-top:2px; }
.dlg .dbtns button{ min-height:28px; padding:0 12px; border:1px solid var(--control); border-radius:4px; background:var(--surface); }
.dlg .dbtns .primary{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
.dlg .dbtns button:disabled{ background:var(--soft); color:var(--mute); border-color:var(--line); font-weight:400; }
.bar{ height:6px; border-radius:3px; background:var(--soft); overflow:hidden; border:1px solid var(--line); }
.bar i{ display:block; height:100%; width:30%; background:var(--accent); animation:slide 1.4s linear infinite; }
:root[data-reduce="true"] .bar i{ animation:none; width:100%; }
@keyframes slide{ from{ margin-left:-30%; } to{ margin-left:100%; } }

/* the native save panel stand-in: drawn by macOS, not by us */
.native{ position:absolute; left:50%; top:90px; width:640px; transform:translateX(-50%); border:2px dashed var(--control); border-radius:6px; background:var(--surface); z-index:5; }
.native .cap{ padding:6px 10px; background:var(--soft); border-bottom:1px solid var(--line); font-size:12px; font-weight:600; display:flex; justify-content:space-between; gap:8px; }
.native .cap span{ color:var(--mute); font-weight:400; }
.native .row{ display:flex; align-items:center; gap:8px; min-height:34px; padding:0 10px; border-bottom:1px solid var(--line); }
.native .row .lbl{ width:90px; color:var(--mute); font-size:12px; flex:none; }
.native .row .val{ flex:1; padding:3px 8px; border:1px solid var(--line); border-radius:3px; background:var(--canvas); font-variant-numeric:tabular-nums; }
.native .badge{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:10px; background:var(--accent); color:var(--on-accent); font-size:12px; font-weight:600; flex:none; }
.native .body{ height:110px; background:var(--soft); display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:12px; }
.native .foot{ display:flex; justify-content:flex-end; gap:8px; padding:8px 10px; }
.native .foot div{ min-width:84px; min-height:28px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:3px; color:var(--mute); }

/* harness annotations (not product) */
.notes{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; max-width:1280px; margin-top:16px; }
.notes section{ border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:12px 14px; }
.notes h2{ margin:0 0 6px; font-size:13px; }
.notes p, .notes li{ margin:0 0 4px; font-size:12px; max-width:600px; }
.notes ul{ margin:0; padding-left:18px; }
.notes .mute{ color:var(--mute); }
.tag{ display:inline-block; padding:0 6px; border-radius:3px; background:var(--accent); color:var(--on-accent); font-size:12px; font-weight:600; margin-right:6px; }
.flow{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px; padding:0; list-style:none; }
.flow li{ padding:2px 8px; border:1px solid var(--line); border-radius:12px; color:var(--mute); margin:0; font-size:12px; }
.flow li.on{ border-color:var(--accent); color:var(--ink); font-weight:600; }
.flow li.no{ border-color:var(--danger); color:var(--ink); }
</style>
</head>
<body>
<header class="top">
  <h1>Export: section .dat, wing STL, 3MF</h1>
  <label class="ctl" for="state">State <select id="state">
    <option value="menu">1 Where Export lives (menus)</option>
    <option value="dat">2 Section .dat</option>
    <option value="stl">3 Wing STL</option>
    <option value="3mf">4 Wing 3MF</option>
    <option value="blocked">5 Geometry not accepted</option>
    <option value="native">6 Save panel (native)</option>
    <option value="writing">7 Writing</option>
    <option value="done">8 Exported</option>
    <option value="failed">9 Write failed</option>
    <option value="cancelled">10 Cancelled</option>
  </select></label>
  <label class="ctl" for="detail">Detail <select id="detail"></select></label>
  <label class="ctl" for="foil">Sample foil <select id="foil"></select></label>
  <label class="ctl" for="theme">Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label class="chk"><input type="checkbox" id="reduce"> Reduced motion</label>
  <p>Display only. Proposed for the operator; nothing is built until you approve it. Numbers are the probe receipts in docs/proof/exd/ for the sample foils; the dashed frame stands in for the native save panel. Revision r12 is illustrative.</p>
</header>
<main>
  <div class="shell" id="shell">
    <div class="chrome" id="chrome">
      <div class="title" data-chrome><b id="winTitle"></b></div>
      <div class="menubar" id="menubar" role="group" aria-label="Menus" data-chrome></div>
      <div class="area" data-chrome><svg id="plan" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Plan view of the wing, schematic"></svg><span class="cap" id="cap"></span></div>
      <div class="sb" id="statusStrip"><div class="msg" id="statusMsg"></div><div class="item" data-chrome>Metric</div></div>
    </div>
    <div class="layer" id="layer"></div>
  </div>
  <div class="notes" id="notes"></div>
</main>
<script type="application/json" id="copy">
{
"EX01": "Export…",

"EX03": "Export needs an open foil.",
"EX04": "Export",

"EX10a": "Station",
"EX11": "File order",

"EX22": "Trailing edge <t> mm below the floor <f> mm (practitioner value, unverified)",

"EX25": "Largest gap to the computed surface: <gap> mm, sampled at cell midpoints. Not a bound.",

"EX34": "Can't write the file. <cause> Nothing was changed. The earlier file is still there.",

<script>
'use strict';
const COPY = JSON.parse(document.getElementById('copy').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const t = (id, vars) => COPY[id].replace(/<(\w+)>/g, (m, k) => vars && k in vars ? vars[k] : m);
const FLOOR_MM = 0.3;          // Settings.cs:28, TeFloorMm
const LARGE_TRIS = 500000;     // proposed large-mesh line (design section 7, H5)
const REV = 12;                // illustrative

// ---- receipts: docs/proof/exd/probe-*.txt. rung = [stations, chord points, triangles, largest measured gap in mm]
const FOILS = {
  A: { name:'Basic foil', label:'Example foil, open TE 0.26 mm', slug:'basic-foil', teMin:0.2556, teAt:'tip', halfSpan:450, bbox:[120.0, 900.0, 15.9], tc:12.0,
       stations:[{ id:'root', name:'Root', chord:120.0, te:0.2557, dev:{ 61:0.0204, 101:0.0074, 201:0.0019 } }, { id:'tip', name:'Tip', chord:120.0, te:0.2557, dev:{ 61:0.0204, 101:0.0074, 201:0.0019 } }],
       rungs:[[11,26,2138,0.1281],[21,51,8278,0.0325],[31,76,18418,0.0145],[41,101,32558,0.0082],[81,201,129118,0.0020],[161,401,514238,0.0005],[321,801,2052478,0.0001]], src:'probe-open.txt, probe2-open-root.txt' },
  B: { name:'Basic foil', label:'Example foil, open TE 0.36 mm', slug:'basic-foil', teMin:0.3578, teAt:'tip', halfSpan:450, bbox:[120.0, 900.0, 15.9], tc:12.0,
       stations:[{ id:'root', name:'Root', chord:120.0, te:0.3580, dev:{ 61:0.0204, 101:0.0074, 201:0.0019 } }, { id:'tip', name:'Tip', chord:120.0, te:0.3580, dev:{ 61:0.0204, 101:0.0074, 201:0.0019 } }],
       rungs:[[11,26,2138,0.1279],[21,51,8278,0.0324],[31,76,18418,0.0145],[41,101,32558,0.0082],[81,201,129118,0.0020],[161,401,514238,0.0005]], src:'probe-open14.txt, probe2-open14-root.txt' },
  C: { name:'Untitled wing', label:'Untitled NACA 0012 wing, closed TE', slug:'untitled-wing', teMin:0, teAt:'every station', halfSpan:500, bbox:[127.1, 1000.0, 15.3], tc:12.0,
       stations:[{ id:'root', name:'Root', chord:127.0, te:0, dev:{ 61:0.0218, 101:0.0079, 201:0.0020 } }, { id:'tip', name:'Tip', chord:12.7, te:0, dev:{ 61:0.0022, 101:0.0008, 201:0.0002 } }],
       rungs:[[11,26,2096,0.7028],[21,51,8196,0.1787],[31,76,18296,0.0798],[41,101,32396,0.0450],[81,201,128796,0.0113],[161,401,513596,0.0028]], src:'probe-default-wing.txt, probe2-default-root.txt' }
};
const TOL = { draft:0.05, print:0.02, fine:0.005 };
const DETAILS = {
  menu:[['file','File menu'],['section','Section menu'],['nofoil','No foil open']],
  dat:[['ready','Ready'],['draft','A draft is open'],['analysis','Analysis mode']],
  stl:[['ready','Ready'],['preparing','Preparing the mesh'],['large','Large mesh (Untitled wing, Fine)'],['draft','A draft is open'],['analysis','Analysis mode']],
  '3mf':[['ready','Ready']],
  blocked:[['unchecked','Geometry check has not passed']],
  native:[['stl','STL'],['dat','.dat'],['3mf','3MF']],
  writing:[['large','Large mesh']],
  done:[['stl','STL'],['dat','.dat'],['3mf','3MF']],
  failed:[['disk','Disk full'],['perm','No permission'],['gone','Folder gone'],['open','Mesh did not close']],
  cancelled:[['panel','Closed the save panel']]
};
const S = { state:'menu', detail:'file', foil:'A', theme:'light', reduce:false, fmt:'dat', station:'root', shape:'at', order:'selig', pts:101, scope:'whole', tol:'print', open:true, mode:'cad', draft:false };

// ---- derived values (all from FOILS + options)
const foil = () => FOILS[S.foil];
const station = () => foil().stations.find(s => s.id === S.station) || foil().stations[0];
function rungFor(tol){ const f = foil(), hit = f.rungs.find(r => r[3] <= tol); return hit ? { rung:hit, met:true } : { rung:f.rungs[f.rungs.length - 1], met:false }; }
const fmtInt = n => n.toLocaleString('en-US');
const mb = tris => ((84 + 50 * tris) / 1e6).toFixed(2);
const mm4 = v => v.toFixed(4);
const mm2 = v => v.toFixed(2);
function fileName(){
  const f = foil(), fmt = S.state === 'native' || S.state === 'done' ? detailFmt() : S.fmt;
  if (fmt === 'dat') return `${f.slug}-${station().id}-r${REV}.dat`;
  if (fmt === 'stl') return `${f.slug}-r${REV}-mm.stl`;
  return `${f.slug}-r${REV}.3mf`;
}
const detailFmt = () => (S.state === 'native' || S.state === 'done') ? S.detail : S.fmt;
function mesh(){ const r = rungFor(TOL[S.tol]); const [s, c, tris, gap] = r.rung;
  return { tris, gap, size:mb(tris), met:r.met, grid:`${s} × ${c}`, large:tris > LARGE_TRIS, print:rungFor(TOL.print).rung[2] }; }
function datRows(){
  const st = station(), n = S.pts;
  // real rows only for the probed section (Example foil, open TE 0.26 mm, Root, 101 per surface, Selig); the others show the structure
  if (S.foil === 'A' && S.station === 'root' && n === 101 && S.shape === 'at' && S.order === 'selig')

function planSvg(){
  const f = foil(), half = f.halfSpan;
  const W = 900, scale = W / (2 * half), cy = 150;
  let pts;
  if (S.foil === 'C') {
    const left = [], right = [];
    for (let i = 0; i <= 40; i++) { const eta = i / 40, c = Math.sqrt(1 - 0.99 * eta * eta) * 127.0, le = (127.0 - c) / 4; left.push([eta, le, le + c]); }
    const mk = side => left.map(([eta, le, te]) => [500 + side * eta * half * scale, 40 + le * scale * 1.6, 40 + te * scale * 1.6]);
    const r = mk(1), l = mk(-1);
    pts = [...l.slice().reverse().map(p => [p[0], p[1]]), ...r.map(p => [p[0], p[1]]), ...r.slice().reverse().map(p => [p[0], p[2]]), ...l.map(p => [p[0], p[2]])];
  } else {
    const c = 120 * scale * 1.6; pts = [[50, cy - c / 2], [950, cy - c / 2], [950, cy + c / 2], [50, cy + c / 2]];
  }
  return `<path d="M${pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L')} Z" fill="#243a40" stroke="#85c9c4" stroke-width="2"/><line x1="500" y1="10" x2="500" y2="290" stroke="#afc6c7" stroke-dasharray="4 4" stroke-width="1"/>`;
}

function setState(patch){
  Object.assign(S, patch);
  if ((S.state === 'stl' && S.detail === 'large') || (S.state === 'writing')) { S.foil = 'C'; S.tol = 'fine'; S.scope = 'whole'; }

document.addEventListener('click', e => {
  const m = e.target.closest('[data-menu]'); if (m) { S.state = 'menu'; S.detail = m.dataset.menu === 'section' ? 'section' : 'file'; render({ focus:false }); return; }
  const fm = e.target.closest('[data-fmt]'); if (fm) { S.fmt = fm.dataset.fmt; S.state = fm.dataset.fmt; if (S.detail === 'large' && S.fmt !== 'stl') S.detail = 'ready'; render({ focus:false }); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const k = a.dataset.act;
  if (k === 'open-export') setState({ state:S.fmt, detail:'ready' });
  else if (k === 'open-dat') setState({ state:'dat', detail:'ready', fmt:'dat' });
  else if (k === 'cancel') setState({ state:'cancelled', detail:'panel' });
  else if (k === 'export') setState({ state:'native', detail:S.fmt });

  else if (k === 'another') setState({ state:'native', detail:S.fmt });

document.addEventListener('keydown', e => {
  const dlg = document.querySelector('.dlg');
  if (!dlg || !dlg.contains(document.activeElement)) return;
  const fm = document.activeElement.closest && document.activeElement.closest('[data-fmt]');
  if (fm && ['ArrowDown', 'ArrowUp', 'ArrowRight', 'ArrowLeft'].includes(e.key)) {
    e.preventDefault(); const order = ['dat', 'stl', '3mf'], i = order.indexOf(fm.dataset.fmt), step = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : -1;
    const next = order[(i + step + order.length) % order.length]; S.fmt = next; S.state = next; render({ focus:false });
    const n = document.querySelector(`[data-fmt="${next}"]`); if (n) n.focus(); return;
  }
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); setState({ state:'cancelled', detail:'panel' }); return; }
  if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON' && document.activeElement.tagName !== 'SELECT') { const d = dlg.querySelector('[data-default="true"]:not([disabled])'); if (d) { e.preventDefault(); d.click(); } return; }
  if (e.key === 'Tab') {
    const f = [...dlg.querySelectorAll('button:not([disabled]):not([tabindex="-1"]), input:not([disabled]), select')].filter(n => n.offsetParent !== null);
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

    shows:['Escape or Cancel anywhere ends the flow with one strip sentence and writes nothing. Focus returns to the menu item that opened the dialog.'] }
};
const CLAIMS = ['Focus moves into a dialog when it opens, onto its default button.', 'Escape closes the dialog (Cancel).', 'Enter activates the default button; Enter in a field does not.', 'Tab and Shift+Tab stay inside the dialog.', 'The format list is one radiogroup: Tab enters it once, arrow keys move the choice.'];
function renderNotes(){
  const n = NOTES[S.state];
  const flow = n.flow.map(f => `<li class="${f[1] === 2 ? 'on' : f[1] === 3 ? 'no' : ''}">${esc(f[0])}</li>`).join('');
  $('notes').innerHTML = `<section data-annot><h2>${esc(n.title)}</h2><ol class="flow" aria-label="Flow">${flow}</ol>${n.shows.map(s => `<p>${esc(s)}</p>`).join('')}<p class="mute">Receipts: ${esc(foil().src)}.</p></section>
  <section data-annot><h2>Keyboard</h2><ul>${CLAIMS.map(c => `<li>${esc(c)}</li>`).join('')}</ul><p class="mute">The native save panel keeps the platform's keys. Copy rows EX01 to EX43 are proposed in docs/design/export.md section 8.</p></section>`;
}

$('state').addEventListener('change', e => { S.state = e.target.value; S.detail = DETAILS[S.state][0][0]; setState({}); });
$('detail').addEventListener('change', e => setState({ detail:e.target.value }));
$('foil').addEventListener('change', e => { S.foil = e.target.value; S.station = 'root'; render({ focus:false }); });
$('theme').addEventListener('change', e => { S.theme = e.target.value; render({ focus:false }); });
$('reduce').addEventListener('change', e => { S.reduce = e.target.checked; render({ focus:false }); });
window.__exd = { S, FOILS, COPY, t, mesh, finding, fileName, rungFor };
render({ focus:false });
</script>
</body>
</html>
