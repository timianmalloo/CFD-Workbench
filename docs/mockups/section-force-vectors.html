<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section force vectors</title>
<!--
  Track SFV review mockup for Ruling 127: Lift and Drag vectors on the Cp-coloured section profile.
  Base: the built profile view (docs/proof/cpv captures) and state B of section-main-area.html. Tokens are that page's.
  The profile and its Cp are a stand-in (NACA 0012 thickness, hand-shaped Cp with Cp_min -0.46 at x/c 0.091); the numbers
  are the capture's example station. Strings not in DESIGN.md are marked "proposed copy". Display only; nothing is built from this page.
-->
<style>
:root{ --font: system-ui, -apple-system, "Segoe UI", sans-serif; }
:root[data-theme="light"]{ --canvas:#f0f2f1; --surface:#fbfcfb; --soft:#e8edeb; --ink:#1b2929; --mute:#526362; --line:#c9d3cf; --control:#788d87; --accent:#006c67; --on-accent:#ffffff; --sel:#d8eeea; --warn:#895900; --danger:#a92e37; --ok:#24653f; }
:root[data-theme="dark"]{ --canvas:#172326; --surface:#1e2d31; --soft:#2a3d40; --ink:#ebf3f0; --mute:#b2c4bf; --line:#49605b; --control:#79928c; --accent:#88d8c6; --on-accent:#172326; --sel:#274c47; --warn:#efc576; --danger:#ffaeb5; --ok:#92d1a5; }
:root{ --vp:#17272c; --vp-soft:#243a40; --vp-ink:#edf4f2; --vp-mute:#afc6c7; --vp-grid:#344b50; --foil:#85c9c4; --lit:#3f6a6c; --warn-vp:#efc576; --lift-vp:#ffffff; --ind-vp:#fbe7bd; }
*{ box-sizing:border-box; }
html, body{ margin:0; background:var(--canvas); color:var(--ink); font:13px/1.45 var(--font); }
button, input{ font:inherit; color:inherit; }
.top{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:10px 20px; border-bottom:1px solid var(--line); }
.top h1{ margin:0; font-size:18px; } .top p{ margin:0; color:var(--mute); font-size:12px; }
.harness{ margin-left:auto; display:flex; gap:12px; align-items:center; }
.harness button{ min-height:28px; padding:0 10px; border:1px solid var(--control); border-radius:4px; background:var(--surface); cursor:pointer; }
.harness label{ font-size:12px; color:var(--mute); display:flex; gap:6px; align-items:center; }
main{ padding:16px 20px 40px; }
[role="tablist"]{ display:flex; gap:4px; margin:0 0 12px; }
[role="tab"]{ min-height:30px; padding:0 14px; border:1px solid var(--control); border-radius:4px; background:var(--surface); cursor:pointer; }
[role="tab"][aria-selected="true"]{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.what{ margin:0 0 10px; max-width:1000px; font-size:12px; color:var(--mute); } .what b{ color:var(--ink); font-weight:600; }
.wrap{ overflow-x:auto; }
.doc{ width:1000px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px; }
.dh{ display:flex; align-items:center; gap:16px; margin:0 0 8px; }
.dh b{ font-size:16px; }
.seg{ display:inline-flex; border:1px solid var(--control); border-radius:4px; overflow:hidden; }
.seg span{ padding:3px 10px; font-size:12px; } .seg span.on{ background:var(--sel); font-weight:600; }
.prof{ position:relative; width:974px; height:380px; background:var(--vp); border-radius:4px; overflow:hidden; }
.prof svg{ position:absolute; left:0; top:0; }
.plate{ position:absolute; background:var(--vp-soft); color:var(--vp-ink); border-radius:3px; padding:3px 8px; white-space:nowrap; font-size:11px; line-height:15px; }
.plate small{ display:block; color:var(--vp-mute); font-size:11px; }
.plate.r{ transform:translateX(-100%); }
.plate .flag{ color:var(--warn-vp); font-weight:600; }
.legend{ right:12px; bottom:10px; } .ramp{ display:block; height:8px; margin:4px 0 2px; width:190px; }
.ends{ display:flex; justify-content:space-between; }
.marks .pc, body.marks .pc{ outline:1px dashed var(--warn-vp); outline-offset:1px; }
body:not(.marks) .pc{ outline:none; }
.below{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-top:12px; }
.below h2{ font-size:15px; margin:0 0 4px; }
table{ border-collapse:collapse; width:100%; font-size:12px; }
th, td{ text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); } td.v{ font-variant-numeric:tabular-nums; }
th{ color:var(--mute); font-weight:600; }
.note{ margin:6px 0 0; font-size:12px; color:var(--mute); } .note.warn{ color:var(--warn); }
.key{ display:flex; flex-wrap:wrap; gap:4px 16px; margin:8px 0 0; font-size:12px; color:var(--mute); }
.key span{ display:inline-flex; align-items:center; gap:6px; } .key svg{ flex:none; }
.pcl{ max-width:1000px; margin:18px 0 0; font-size:12px; } .pcl h2{ font-size:15px; margin:0 0 4px; } .pcl li{ margin:0 0 3px; }
</style>
</head>
<body class="marks">
<header class="top">
  <h1>Section force vectors</h1>
  <p>Ruling 127 review mockup. Nothing is built from this page.</p>
  <div class="harness">
    <label><input type="checkbox" id="marks" checked> Mark proposed copy</label>
    <button type="button" id="theme" aria-pressed="false">Dark</button>
  </div>
</header>
<main>
  <div role="tablist" aria-label="States">
    <button role="tab" id="tab-A" aria-selected="true" aria-controls="stage" data-s="A">A · Normal strip</button>
    <button role="tab" id="tab-B" aria-selected="false" aria-controls="stage" data-s="B" tabindex="-1">B · Near zero lift</button>
    <button role="tab" id="tab-C" aria-selected="false" aria-controls="stage" data-s="C" tabindex="-1">C · Flagged drag</button>
    <button role="tab" id="tab-D" aria-selected="false" aria-controls="stage" data-s="D" tabindex="-1">D · Imperial</button>
  </div>
  <p class="what" id="what"></p>
  <div class="wrap"><div id="stage" role="tabpanel" aria-labelledby="tab-A"></div></div>
  <div class="pcl"><h2>Proposed copy (not in DESIGN.md COPY-293..405)</h2><ol id="pcl"></ol></div>
</main>
<script>
const $ = s => document.querySelector(s);
const f = (x, n) => x.toFixed(n).replace('-', '−');
const RAD = Math.PI / 180, NPF = 0.0685218;
const Q = 13553, CH = 0.12, VCRIT = 21.2, KN = 1.94384;
const BASE = { eta: 1, cl: 0.115, cm: -0.002, aeff: 0.96, ageo: 2.00, lift: 134.44, cd: 0.00803, imp: false, flag: false, tag: 'A' };
const STATES = {
  A: Object.assign({}, BASE),
  B: Object.assign({}, BASE, { cl: 0.0015, aeff: 0.01, ageo: 0.50, lift: Q * CH * 0.0015, cd: 0.00790, tag: 'B' }),
  C: Object.assign({}, BASE, { flag: true, tag: 'C' }),
  D: Object.assign({}, BASE, { imp: true, tag: 'D' })
};
const WHAT = {
  A: '<b>A. A normal strip.</b> The centre of pressure (CP) sits at x/c 0.267, on the section. Lift stands on it, drag runs along the faint inflow. Drag is drawn at ten times the lift scale, in two segments: profile, then induced.',
  B: '<b>B. Near zero lift.</b> x_cp = 0.25 − Cm c/4 / cl leaves the section as cl goes to zero. The arrows start at the quarter chord and a note says so. The lift arrow is true to scale, so it is a hair.',
  C: '<b>C. Drag carries a flag.</b> The profile drag is outside the validated bracket and the polar confidence is low. The flag rides on the drag label, and the two approved sentences sit under the table. The induced part comes from the lattice and is not flagged.',
  D: '<b>D. Imperial.</b> Values in lbf/ft, the lift scale in lbf/ft, V_crit in kn (Ruling 126). The geometry is the same as A: the scales are chosen so the arrows keep their size.'
};
const PC = [
  'L′ <v> <unit> (lift label), second line "1 c = <v> <unit>" (lift scale)',
  'D′ profile <v> <unit> · ×10 (profile drag label)',
  'D′ induced <v> <unit> · ×10 · illustrative (induced drag label)',
  'CP · x/c <x> (anchor label)',
  'inflow α_eff <a>° (inflow label)',
  'c/4 · arrows start here (anchor label, state B)',
  'CP x/c <x> · off the section (marker at the trailing edge, state B)',
  'Centre of pressure is outside the section at this lift. The arrows start at the quarter chord. (note, state B)',
  '· low confidence (suffix on the profile drag label, state C; the first words of COPY-316) and · flagged (suffix on the table value)',
  'Force on this strip, per span (table heading)',
  'Table row labels: Lift L′ · Profile drag D′ profile · Induced drag D′ induced · Drag D′ · Centre of pressure x_cp/c · α_i',
  'Induced drag here is L′ · sin(α_i), with α_i = α_geo − α_eff. Illustrative. (table note)',
  'Vector key: Inflow · Lift · Drag, profile · Drag, induced (the key under the plate)'
];
$('#pcl').innerHTML = PC.map(s => '<li>' + s.replace(/</g, '&lt;') + '</li>').join('');

// ---- stand-in section: NACA 0012 thickness, hand-shaped Cp (Cp_min -0.46 at x/c 0.091 upper)
const ytn = x => 0.6 * (0.2969 * Math.sqrt(x) - 0.126 * x - 0.3516 * x * x + 0.2843 * x ** 3 - 0.1036 * x ** 4);
function cp(x, up){
  const stag = 0.99 * Math.exp(-x / 0.014);
  if (up){ const b = x < 0.091 ? -0.46 * Math.sqrt(x / 0.091) : -0.46 * Math.pow(1 - (x - 0.091) / 0.909, 1.2) + 0.22 * Math.pow((x - 0.091) / 0.909, 5); return b + stag; }
  const b = x < 0.3 ? -0.25 * Math.sqrt(x / 0.3) : -0.25 * Math.pow(1 - (x - 0.3) / 0.7, 1.1) + 0.2 * Math.pow((x - 0.3) / 0.7, 5);
  return b + stag;
}
const VIK = ['#001261', '#2f7fa6', '#ece8e5', '#c47b50', '#590008'];
function vik(t){ t = Math.min(1, Math.max(0, t)) * 4; const i = Math.min(3, Math.floor(t)), w = t - i, p = h => [1, 3, 5].map(k => parseInt(h.substr(k, 2), 16)), a = p(VIK[i]), b = p(VIK[i + 1]); return 'rgb(' + a.map((v, k) => Math.round(v + (b[k] - v) * w)).join(',') + ')'; }

const W = 974, H = 380, OX = 150, S = 700, OY = 190;
const P = (x, y) => [OX + x * S, OY - y * S];
function arrow(x0, y0, dx, dy, color, width, dash, head){
  const L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, h = head === false ? 0 : 10, x1 = x0 + dx, y1 = y0 + dy;
  const bx = x1 - ux * h, by = y1 - uy * h, nx = -uy * 5, ny = ux * 5;
  const ln = (c, w) => '<line x1="' + x0.toFixed(1) + '" y1="' + y0.toFixed(1) + '" x2="' + (head === false ? x1 : bx).toFixed(1) + '" y2="' + (head === false ? y1 : by).toFixed(1) + '" stroke="' + c + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' stroke-linecap="butt"/>';
  const hd = c => h ? '<polygon points="' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' ' + (bx + nx).toFixed(1) + ',' + (by + ny).toFixed(1) + ' ' + (bx - nx).toFixed(1) + ',' + (by - ny).toFixed(1) + '" fill="' + c + '" stroke="' + (c === 'var(--vp)' ? 'var(--vp)' : 'var(--vp)') + '" stroke-width="' + (c === 'var(--vp)' ? 3 : 0) + '"/>' : '';
  return { halo: ln('var(--vp)', width + 4) + hd('var(--vp)'), main: ln(color, width) + hd(color) };
}
const plate = (x, y, html, cls, right) => '<div class="plate ' + (cls || '') + (right ? ' r' : '') + '" style="left:' + x + 'px;top:' + y + 'px">' + html + '</div>';

function render(k){
  const s = STATES[k], imp = s.imp, u = imp ? 'lbf/ft' : 'N/m', cv = imp ? NPF : 1;
  const nat = v => v * cv;
  const xcp = 0.25 - (s.cm / s.cl), off = xcp < 0 || xcp > 1, xa = off ? 0.25 : xcp;
  const aI = s.ageo - s.aeff, prof = s.cd * Q * CH, ind = s.lift * Math.sin(aI * RAD), tot = prof + ind;
  const LSC = imp ? 70 : 1000;              // 1 chord of lift arrow = this many u
  const lpx = nat(s.lift) / LSC * S, dscale = 10, ppx = nat(prof) * dscale / LSC * S, ipx = nat(ind) * dscale / LSC * S;
  const a = s.aeff * RAD, d = [Math.cos(a), Math.sin(a)], n = [Math.sin(a), -Math.cos(a)];
  const [cx, cy] = P(xa, 0);
  let up = [], lo = [], seg = '';
  const N = 90; for (let i = 0; i <= N; i++){ const x = 0.5 * (1 - Math.cos(Math.PI * i / N)); up.push([x, ytn(x), cp(x, true)]); lo.push([x, -ytn(x), cp(x, false)]); }
  const pts = up.concat(lo.slice().reverse());
  const body = pts.map(p => P(p[0], p[1]).map(v => v.toFixed(1)).join(',')).join(' ');
  const cabs = 0.99;
  const stroke = (arr) => arr.slice(1).map((p, i) => { const a0 = P(arr[i][0], arr[i][1]), b0 = P(p[0], p[1]); return '<line x1="' + a0[0].toFixed(1) + '" y1="' + a0[1].toFixed(1) + '" x2="' + b0[0].toFixed(1) + '" y2="' + b0[1].toFixed(1) + '" stroke="' + vik(0.5 + (arr[i][2] + p[2]) / 4 / cabs) + '" stroke-width="5" stroke-linecap="round"/>'; }).join('');
  const m = P(0.091, ytn(0.091));
  // vectors
  const lift = arrow(cx, cy, n[0] * lpx, n[1] * lpx, 'var(--lift-vp)', 3);
  const dp = arrow(cx, cy, d[0] * ppx, d[1] * ppx, 'var(--warn-vp)', 4, null, false);
  const ex = cx + d[0] * ppx, ey = cy + d[1] * ppx;
  const di = arrow(ex, ey, d[0] * ipx, d[1] * ipx, 'var(--ind-vp)', 4, '4 2');
  const tick = '<line x1="' + (ex - n[0] * 7).toFixed(1) + '" y1="' + (ey - n[1] * 7).toFixed(1) + '" x2="' + (ex + n[0] * 7).toFixed(1) + '" y2="' + (ey + n[1] * 7).toFixed(1) + '" stroke="var(--vp)" stroke-width="2"/>';
  // inflow, faint
  const ix1 = OX - 24, iy1 = OY - 0, ilen = 120;
  const infl = arrow(ix1 - d[0] * ilen, iy1 - d[1] * ilen, d[0] * ilen, d[1] * ilen, 'var(--vp-mute)', 1.5, '5 4');
  // anchor
  let anchor = '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="5" fill="var(--vp-ink)" stroke="var(--vp)" stroke-width="2"/>';
  if (off) anchor = '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="5.5" fill="var(--vp)" stroke="var(--vp-ink)" stroke-width="2"/>';
  const cpOff = off ? '<polygon points="' + (OX + S + 40) + ',' + (OY - 7) + ' ' + (OX + S + 47) + ',' + OY + ' ' + (OX + S + 40) + ',' + (OY + 7) + ' ' + (OX + S + 33) + ',' + OY + '" fill="var(--vp)" stroke="var(--vp-ink)" stroke-width="2"/><line x1="' + (OX + S + 47) + '" y1="' + OY + '" x2="' + (OX + S + 70) + '" y2="' + OY + '" stroke="var(--vp-ink)" stroke-width="2"/>' : '';
  // leaders for drag labels
  const pmx = cx + d[0] * ppx * 0.5, imx = cx + d[0] * (ppx + ipx / 2), yI = OY + 64, yP = OY + 92;
  const leaders = '<line x1="' + pmx.toFixed(1) + '" y1="' + (cy + 6) + '" x2="' + pmx.toFixed(1) + '" y2="' + yP + '" stroke="var(--vp-mute)" stroke-width="1"/>' +
    '<line x1="' + imx.toFixed(1) + '" y1="' + (cy + 4) + '" x2="' + imx.toFixed(1) + '" y2="' + yI + '" stroke="var(--vp-mute)" stroke-width="1"/>' +
    (lpx < 40 ? '<line x1="' + cx.toFixed(1) + '" y1="' + (cy - 8) + '" x2="' + cx.toFixed(1) + '" y2="' + (cy - 26) + '" stroke="var(--vp-mute)" stroke-width="1"/>' : '');
  const svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Section profile with pressure coefficient, and the lift and drag vectors at the centre of pressure">' +
    '<line x1="' + P(-0.02, 0)[0] + '" y1="' + OY + '" x2="' + P(1.02, 0)[0] + '" y2="' + OY + '" stroke="var(--vp-grid)" stroke-width="1" stroke-dasharray="4 4"/>' +
    '<polygon points="' + body + '" fill="var(--lit)"/>' + stroke(up) + stroke(lo) +
    '<circle cx="' + m[0].toFixed(1) + '" cy="' + m[1].toFixed(1) + '" r="7" fill="none" stroke="var(--vp-ink)" stroke-width="2"/>' +
    infl.main + leaders + lift.halo + dp.halo + di.halo + lift.main + dp.main + di.main + tick + anchor + cpOff + '</svg>';
  // labels
  const fv = (v, n) => f(nat(v), n);
  const ls = imp ? '70 lbf/ft' : '1000 N/m';
  let h = '';
  h += plate(12, 10, 'Section · η 1');
  h += plate(W - 12, 10, 'Estimator · local calculation · inviscid; no boundary layer', '', true).replace('left:' + (W - 12), 'left:' + (W - 12));
  h += plate(OX - 134, OY + 18, 'inflow α_eff ' + f(s.aeff, 2) + '°', 'pc');
  h += plate(m[0] - 12, m[1] - 40, 'Cp_min −0.46 · x/c 0.091 · upper', '', true);
  const tipX = cx + n[0] * lpx, tipY = cy + n[1] * lpx;
  const short = lpx < 40, ltop = short ? cy - 64 : tipY - 14;
  h += plate(Math.round(short ? cx - 6 : tipX + 14), Math.round(ltop), 'L′ ' + fv(s.lift, 2) + ' ' + u + '<small>1 c = ' + ls + '</small>', 'pc');
  h += plate(Math.round(cx - 10), OY + 62, off ? 'c/4 · arrows start here' : 'CP · x/c ' + f(xcp, 3), 'pc', true);
  const flagTxt = s.flag ? ' <span class="flag">· low confidence</span>' : '';
  h += plate(Math.round(imx - 14), yI, 'D′ induced ' + fv(ind, 2) + ' ' + u + ' · ×10 · illustrative', 'pc');
  h += plate(Math.round(pmx - 26), yP, 'D′ profile ' + fv(prof, 2) + ' ' + u + ' · ×10' + flagTxt, 'pc');
  if (off) h += plate(W - 12, OY + 14, 'CP x/c ' + f(xcp, 2) + ' · off the section', 'pc', true);
  h += plate(12, H - 56, 'x/c 0 → 1');
  h += plate(12, H - 30, 'σ 7.80 · −Cp_min 0.46 · clear of the 15 % margin · V_crit ' + (imp ? f(VCRIT * KN, 1) + ' kn' : f(VCRIT, 1) + ' m/s'));
  h += '<div class="plate legend">Cp · vik pinned at 0 · −0.99 to 0.99<span class="ramp" style="background:linear-gradient(90deg,' + VIK.join(",") + ')"></span><span class="ends"><span>−0.99</span><span>0</span><span>0.99</span></span></div>';
  const key = '<div class="key" aria-label="Key">' +
    '<span><svg width="30" height="10" aria-hidden="true"><line x1="1" y1="5" x2="29" y2="5" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="5 4"/></svg><span class="pc">Inflow</span></span>' +
    '<span><svg width="30" height="10" aria-hidden="true"><line x1="1" y1="5" x2="29" y2="5" stroke="var(--ink)" stroke-width="3"/></svg><span class="pc">Lift</span></span>' +
    '<span><svg width="30" height="10" aria-hidden="true"><line x1="1" y1="5" x2="29" y2="5" stroke="var(--warn)" stroke-width="4"/></svg><span class="pc">Drag, profile</span></span>' +
    '<span><svg width="30" height="10" aria-hidden="true"><line x1="1" y1="5" x2="29" y2="5" stroke="var(--warn)" stroke-width="4" stroke-dasharray="4 2"/></svg><span class="pc">Drag, induced</span></span></div>';
  const row = (a, b, c) => '<tr><th scope="row" class="' + (c || '') + '">' + a + '</th><td class="v">' + b + '</td></tr>';
  const tbl = '<table><caption style="text-align:left;font-weight:600;padding:0 0 4px" class="pc">Force on this strip, per span</caption>' +
    row('cl (panel)', f(s.cl, s.cl < 0.01 ? 4 : 3)) + row('Cm c/4', f(s.cm, 3)) + row('α_eff', f(s.aeff, 2) + ' °') +
    row('α_i', f(aI, 2) + ' ° · illustrative', 'pc') +
    row('Centre of pressure x_cp/c', off ? f(xcp, 2) + ' · off the section' : f(xcp, 3), 'pc') +
    row('Lift L′', fv(s.lift, 2) + ' ' + u, 'pc') +
    row('Profile drag D′ profile', fv(prof, 2) + ' ' + u + (s.flag ? ' · flagged' : ''), 'pc') +
    row('Induced drag D′ induced', fv(ind, 2) + ' ' + u + ' · illustrative', 'pc') +
    row('Drag D′', fv(tot, 2) + ' ' + u, 'pc') + '</table>';
  let notes = '<p class="note">Profile drag from the polar at α_eff, both Ncrit; band, not a prediction</p>' +
    '<p class="note pc">Induced drag here is L′ · sin(α_i), with α_i = α_geo − α_eff. Illustrative.</p>';
  if (off) notes += '<p class="note warn pc">Centre of pressure is outside the section at this lift. The arrows start at the quarter chord.</p>';
  if (s.flag) notes += '<p class="note warn">Low confidence — analysis_confidence 0.31 is below 0.5. Computed and flagged, never refused; not an error bar.</p>' +
    '<p class="note warn">Outside the validated bracket — the surrogate is validated on NACA 0012 only. Computed, not validated.</p>';
  return '<div class="doc"><div class="dh"><b>Selected strip · η 1</b><span class="seg" aria-label="Chart"><span class="on">Cp</span><span>Polar</span><span>Transition</span><span>Bucket</span></span></div>' +
    '<div class="prof">' + svg + h + '</div>' + key + '<div class="below"><div>' + tbl + '</div><div>' + notes + '</div></div></div>';
}
let cur = 'A';
function show(k){
  cur = k; $('#stage').innerHTML = render(k); $('#what').innerHTML = WHAT[k];
  document.querySelectorAll('[role="tab"]').forEach(t => { const on = t.dataset.s === k; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; });
  $('#stage').setAttribute('aria-labelledby', 'tab-' + k);
}
document.querySelectorAll('[role="tab"]').forEach(t => {
  t.addEventListener('click', () => show(t.dataset.s));
  t.addEventListener('keydown', e => { const ks = ['A', 'B', 'C', 'D'], i = ks.indexOf(cur), j = e.key === 'ArrowRight' ? (i + 1) % 4 : e.key === 'ArrowLeft' ? (i + 3) % 4 : -1; if (j >= 0){ show(ks[j]); $('#tab-' + ks[j]).focus(); } });
});
$('#theme').addEventListener('click', e => { const dk = document.documentElement.dataset.theme !== 'dark'; document.documentElement.dataset.theme = dk ? 'dark' : 'light'; e.target.textContent = dk ? 'Light' : 'Dark'; e.target.setAttribute('aria-pressed', dk); });
$('#marks').addEventListener('change', e => document.body.classList.toggle('marks', e.target.checked));
const hs = new URLSearchParams(location.search); if (hs.get('theme') === 'dark') $('#theme').click(); if (hs.get('marks') === '0'){ $('#marks').checked = false; document.body.classList.remove('marks'); }
show(STATES[hs.get('s')] ? hs.get('s') : 'A');
</script>
</body>
