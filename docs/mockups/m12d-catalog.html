  Geometry is COMPUTED here from src/CfdWorkbench.Desktop/Assets/example.foil: section-a's two degree-5 surfaces, a
  PAIRED Control -> Anchor conversion (Ruling 60, ADR-0005 §6: Boehm insertion to multiplicity 5 and the ADR-0005 shift on

function thumb2(g, w, h, up, lo, pv){ const s = (w - 16), S = ([x, y]) => [8 + x * s, h * 0.5 - y * s * 1.1];
  const q = c => { const r = []; for (let i = 0; i <= 200; i++) r.push(S(at(c, i / 200))); return r; };
  line(g, q(up), C.foil, 1.5); line(g, q(lo), C.foil, 1.5); if (pv) pv.forEach(pts => line(g, pts.map(S), C.station, 1.5, [4, 3])); }
function marker(g, w, h, x, label){ const x0 = -0.04, x1 = 1.04, s = (w - 60) / (x1 - x0), X = 30 + (x - x0) * s;
  line(g, [[X, 40], [X, h - 52]], C.station, 1, [2, 3]); g.save(); g.font = '11px system-ui, sans-serif'; g.fillStyle = C.station; g.fillText(label, Math.min(X + 4, w - 150), 52); g.restore(); }

function cardHTML2(c){ if (c.text) return `<div class="card"><div class="textcard"><h3 style="margin-top:0">${c.h}</h3><p>${c.p}</p></div></div>`;
  return `<div class="card"><div class="frame">${shell(c.o)}</div><h3>${c.h}${c.rec ? '<span class="rec">Recommended</span>' : '<span class="rec lost">Not recommended</span>'}</h3><p>${c.p}</p></div>`; }
function listHTML(d){ return `<table class="drt"><thead><tr><th>DR</th><th>Question</th><th>Recommended</th><th>Other</th></tr></thead><tbody>${d.list.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>`; }

function paint(){
  document.querySelectorAll('canvas[data-k]').forEach(cv => {
    const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return; const dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = C.vp; g.fillRect(0, 0, w, h);
    DRAW[cv.dataset.k](g, w, h); });
  document.getElementById('measured').innerHTML = `Numbers: the probe receipt <code>docs/proof/m12d-catalog/output/table.md</code> (as-built Core: DatImport.FitToBasis, DatImport.Fit, Geometry.Assess). Check on this page: the largest change from section-a to the probe's NACA 4412 record, computed here by x inversion, is <code>${MEASURE.change4412PagePct} %</code> chord; the probe's A4.5 oracle says <code>${MEASURE.change4412ProbePct} %</code>. Records drawn: section-a (example.foil) and the probe's fitted records; dashed previews: the NACA closed form.`;
  window.__measure = MEASURE; }
