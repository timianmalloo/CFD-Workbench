name: docs-health

on:
  pull_request:
    paths: ["docs/**", "**/*.md", "tools/**", ".github/**", ".claude/**", ".agents/**", ".grok/**", ".gitattributes", ".gitignore"]
  push:
    branches: [main]
    paths: ["docs/**", "**/*.md", "tools/**", ".github/**", ".claude/**", ".agents/**", ".grok/**", ".gitattributes", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Documentation graph, foundation, and audit checks
        run: python3 tools/check-docs.py
      - name: Pack installation health
        run: python3 docs/ai-forward-pack/scripts/pack-doctor.py
