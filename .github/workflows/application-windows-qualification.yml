name: Disposable Windows x64 W0 qualification
on:
  push:
    branches:
      - feature/windows-w1-qualification-20260925
permissions:
  contents: read
jobs:
  qualify:
    # W0 prepares this file only. Owner must authorize the concrete W1 branch/run.
    if: github.ref == 'refs/heads/feature/windows-w1-qualification-20260925'
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        env:
          DOTNET_CLI_HOME: ${{ runner.temp }}/w0-dotnet-home
          NUGET_PACKAGES: ${{ runner.temp }}/w0-nuget
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/w0-sdk
        with:
          dotnet-version: '10.0.203'
          cache: false
      - name: Receipt wrong-result controls
        shell: pwsh
        env:
          DOTNET_CLI_HOME: ${{ runner.temp }}/w0-dotnet-home
          NUGET_PACKAGES: ${{ runner.temp }}/w0-nuget
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/w0-sdk
        run: |
          python tools/qualify-windows-runtime.py --self-test
          exit $LASTEXITCODE
      - name: Execute disposable native and hosted UIA capability probes
        shell: pwsh
        env:
          DOTNET_CLI_HOME: ${{ runner.temp }}/w0-dotnet-home
          NUGET_PACKAGES: ${{ runner.temp }}/w0-nuget
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/w0-sdk
        run: |
          python tools/qualify-windows-runtime.py --output "${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}"
          exit $LASTEXITCODE
      - name: Retain source-bound receipts even on refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w0-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/source.json
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/rows.json
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/binary-manifest.json
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/bin/WindowsRuntime/release/WindowsRuntime.exe
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/bin/WindowsRuntime/release/WindowsRuntime.dll
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/bin/WindowsRuntime/release/WindowsRuntime.deps.json
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/bin/WindowsRuntime/release/WindowsRuntime.runtimeconfig.json
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/*/stdout.txt
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/*/stderr.txt
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/*/process.json
            ${{ runner.temp }}/w0-${{ github.run_id }}-${{ github.run_attempt }}/fixture-*.bin
          if-no-files-found: error
          retention-days: 3
